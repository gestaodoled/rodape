<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- CONFIG -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<!-- SISTEMA -->

<script>

/* CONFIG VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* CONTADOR */

let cycleCount = 0;


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    let result = txt.value;

    result = result
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

    return result;

}


/* RSS */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* COTAÇÕES */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* ITEM ALEATÓRIO */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* LOAD */

async function loadContent(){

    let html = "";


    for(let block of CONFIG.enabledBlocks){

        if(block === "clima"){

            const weather =
            await getWeather();

            html +=
            '<span class="clima">CLIMA</span> ' +
            CONFIG.city + ' ' +
            weather.temp +
            '°C' +
            '<span class="sep">◆</span>';

        }


        if(block === "previsao"){

            const weather =
            await getWeather();

            html +=
            '<span class="previsao">PREVISÃO</span> Máx ' +
            weather.max +
            '° Mín ' +
            weather.min +
            '°' +
            '<span class="sep">◆</span>';

        }


        if(block === "transito"){

            let transito =
            await getRSS(
            CONFIG.trafficRSS
            );

            let item =
            pickOne(transito);

            if(item){

                html +=
                '<span class="transito">TRÂNSITO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "rodovias"){

            html +=
            '<span class="rodovias">RODOVIAS</span> Fluxo moderado nas principais rodovias' +
            '<span class="sep">◆</span>';

        }


        if(block === "esporte"){

            let esporte =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/"
            );

            let item =
            pickOne(esporte);

            if(item){

                html +=
                '<span class="esporte">ESPORTE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "resultados"){

            let futebol =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/"
            );

            let item =
            pickOne(futebol);

            if(item){

                html +=
                '<span class="resultados">RESULTADOS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "selecao"){

            let selecao =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/selecao-brasileira/"
            );

            let item =
            pickOne(selecao);

            if(item){

                html +=
                '<span class="selecao">SELEÇÃO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "classificacao"){

            let brasileirao =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/"
            );

            let item =
            pickOne(brasileirao);

            if(item){

                html +=
                '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "dolar"){

            const money =
            await getMoney();

            html +=
            '<span class="dolar">DÓLAR</span> R$ ' +
            money.usd +
            '<span class="sep">◆</span>';

        }


        if(block === "euro"){

            const money =
            await getMoney();

            html +=
            '<span class="euro">EURO</span> R$ ' +
            money.eur +
            '<span class="sep">◆</span>';

        }


        if(block === "bitcoin"){

            const money =
            await getMoney();

            html +=
            '<span class="bitcoin">BITCOIN</span> R$ ' +
            money.btc +
            '<span class="sep">◆</span>';

        }


        if(block === "mercado"){

            let mercado =
            await getRSS(
            "https://g1.globo.com/rss/g1/economia/"
            );

            let item =
            pickOne(mercado);

            if(item){

                html +=
                '<span class="mercado">MERCADO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "tech"){

            let tech =
            await getRSS(
            "https://g1.globo.com/rss/g1/tecnologia/"
            );

            let item =
            pickOne(tech);

            if(item){

                html +=
                '<span class="tech">TECH</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "trending"){

            let trends =
            await getRSS(
            "https://rss.uol.com.br/feed/tecnologia.xml"
            );

            let item =
            pickOne(trends);

            if(item){

                html +=
                '<span class="trending">TRENDING</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "eventos"){

            let eventos =
            await getRSS(
            CONFIG.trafficRSS
            );

            let item =
            pickOne(eventos);

            if(item){

                html +=
                '<span class="eventos">EVENTOS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "aeroportos"){

            html +=
            '<span class="aeroportos">AEROPORTOS</span> Operação normal nos principais aeroportos' +
            '<span class="sep">◆</span>';

        }


        if(block === "megasena"){

            html +=
            '<span class="megasena">MEGA-SENA</span> Confira o prêmio acumulado do próximo sorteio' +
            '<span class="sep">◆</span>';

        }


        if(block === "saude"){

            let saude =
            await getRSS(
            "https://g1.globo.com/rss/g1/bemestar/"
            );

            let item =
            pickOne(saude);

            if(item){

                html +=
                '<span class="saude">SAÚDE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "alerta"){

            html +=
            '<span class="alerta">ALERTA</span> Acompanhe condições climáticas e trânsito em tempo real' +
            '<span class="sep">◆</span>';

        }


        if(block === "entretenimento"){

            let entretenimento =
            await getRSS(
            "https://g1.globo.com/rss/g1/pop-arte/"
            );

            let item =
            pickOne(entretenimento);

            if(item){

                html +=
                '<span class="entretenimento">ENTRETENIMENTO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "news"){

            let geral =
            await getRSS(
            "https://g1.globo.com/rss/g1/"
            );

            let item =
            pickOne(geral);

            if(item){

                html +=
                '<span class="news">NEWS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        if(block === "motivacao"){

            const frases = [

                "Grandes resultados exigem constância",
                "Persistência gera resultados",
                "Disciplina vence talento",
                "Foco no objetivo"

            ];

            html +=
            '<span class="motivacao">MOTIVAÇÃO</span> ' +
            frases[
            Math.floor(
            Math.random() * frases.length
            )] +
            '<span class="sep">◆</span>';

        }


        if(block === "lumix"){

            const lumix = [

                "Impacto visual que vende",
                "Especialistas em painéis de LED",
                "Tecnologia visual de alto impacto"

            ];

            html +=
            '<span class="lumix">LUMIX LED</span> ' +
            lumix[
            Math.floor(
            Math.random() * lumix.length
            )] +
            '<span class="sep">◆</span>';

        }


        if(block === "instagram"){

            html +=
            '<span class="instagram">INSTAGRAM</span> ' +
            CONFIG.instagram +
            '<span class="sep">◆</span>';

        }

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* INICIAR */

loadContent();


/* ATUALIZA */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});


/* RELOAD */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
