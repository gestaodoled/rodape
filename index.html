<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX NEWS PRO - MODULAR</title>

<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
#left-box{position:absolute;left:0;top:0;background:#C00000;color:#fff;font-weight:bold;text-align:center}
#clock{position:absolute;top:0;background:#111;color:#00FF99;font-weight:bold;text-align:center}
#ticker{position:absolute;top:0;overflow:hidden;white-space:nowrap;color:#fff}
#ticker-content{display:inline-block;white-space:nowrap;padding-left:100%;animation:scroll linear infinite}

@keyframes scroll{
from{transform:translateX(0)}
to{transform:translateX(-100%)}
}

.esporte{color:#00FF00;font-weight:bold}
.news{color:#fff;font-weight:bold}
.economia{color:#FFD700;font-weight:bold}
.sep{color:#666;padding:0 14px}
</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
<div id="ticker-content">Carregando...</div>
</div>

<script>

const params=new URLSearchParams(window.location.search);
const configName=params.get("config")||"default";

document.write('<script src="configs/'+configName+'.js"><\/script>');

</script>

<script>

/* ================= CONFIG ================= */

document.body.style.width=CONFIG.width+"px";
document.body.style.height=CONFIG.height+"px";

document.getElementById("left-box").style.width=Math.round(CONFIG.width*0.15)+"px";
document.getElementById("left-box").style.height=CONFIG.height+"px";
document.getElementById("left-box").innerHTML=CONFIG.title;

document.getElementById("clock").style.left=Math.round(CONFIG.width*0.15)+"px";
document.getElementById("clock").style.width=Math.round(CONFIG.width*0.09)+"px";

document.getElementById("ticker").style.left=Math.round(CONFIG.width*0.24)+"px";
document.getElementById("ticker").style.width=Math.round(CONFIG.width*0.76)+"px";

document.getElementById("ticker-content").style.animationDuration=CONFIG.speed+"s";

/* ================= CLOCK ================= */

setInterval(()=>{
const d=new Date();
document.getElementById("clock").innerHTML=
String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
},1000);

/* ================= RSS CORE ================= */

async function fetchRSS(url){

try{
const r=await fetch(url);
const t=await r.text();
const xml=new DOMParser().parseFromString(t,"text/xml");
const items=xml.querySelectorAll("item");

let out=[];
items.forEach(i=>{
const title=i.querySelector("title")?.textContent;
if(title) out.push({title});
});

return out;

}catch{
return [];
}

}

/* ================= CACHE ================= */

let CACHE={
esporte:[],
news:[],
economia:[]
};

let last={};

/* ================= MÓDULO 1 - ESPORTE EXPANDIDO ================= */

async function refreshCache(){

/* 🟢 ESPORTE MULTIFONTE (FASE 1 ATIVA) */
CACHE.esporte = [
    ...await fetchRSS("https://ge.globo.com/rss/ge/futebol/"),
    ...await fetchRSS("https://rss.uol.com.br/feed/esporte.xml"),
    ...await fetchRSS("https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/"),
    ...await fetchRSS("https://ge.globo.com/rss/ge/futebol/libertadores/")
];

/* NEWS (mantido base) */
CACHE.news = await fetchRSS("https://g1.globo.com/rss/g1/");

/* ECONOMIA (mantido base) */
CACHE.economia = await fetchRSS("https://g1.globo.com/rss/g1/economia/");

}

/* ================= PICK SEM REPETIÇÃO ================= */

function pick(arr,key){

if(!arr.length) return null;

let filtered=arr.filter(i=>i.title!==last[key]);
if(!filtered.length) filtered=arr;

const item=filtered[Math.floor(Math.random()*filtered.length)];

last[key]=item.title;

return item;

}

/* ================= RENDER ================= */

function render(){

let html="";

let e=pick(CACHE.esporte,"e");
let n=pick(CACHE.news,"n");
let c=pick(CACHE.economia,"c");

if(e) html+=`<span class="esporte">ESPORTE</span> ${e.title}<span class="sep">◆</span>`;
if(n) html+=`<span class="news">NEWS</span> ${n.title}<span class="sep">◆</span>`;
if(c) html+=`<span class="economia">ECONOMIA</span> ${c.title}<span class="sep">◆</span>`;

document.getElementById("ticker-content").innerHTML=html;

}

/* ================= LOOP ================= */

async function start(){

await refreshCache();
render();

setInterval(render,5000);
setInterval(refreshCache,60000);

}

start();

</script>

</body>
</html>
