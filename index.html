<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>2 LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- CONFIG -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<!-- SISTEMA -->

<script>

/* CONFIG VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    let result = txt.value;

    result = result
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

    return result;

}


/* RSS */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&timezone=America%2FSao_Paulo`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m)

        };

    }catch(error){

        return {

            temp:22

        };

    }

}


/* ITEM ALEATÓRIO */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* LOAD */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();


    for(let block of CONFIG.enabledBlocks){

        /* CLIMA */

        if(block === "clima"){

            html +=
            '<span class="clima">CLIMA</span> ' +
            CONFIG.city + ' ' +
            weather.temp +
            '°C' +
            '<span class="sep">◆</span>';

        }


        /* ESPORTE */

        if(block === "esporte"){

            let esporte =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/"
            );

            esporte = esporte.filter(item =>
                item.title &&
                item.title.length > 15
            );

            let item =
            pickOne(esporte);

            if(item){

                html +=
                '<span class="esporte">ESPORTE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* TRÂNSITO */

        if(block === "transito"){

            let transito =
            await getRSS(
            CONFIG.trafficRSS
            );

            transito = transito.filter(item =>
                item.title &&
                item.title.length > 15
            );

            let item =
            pickOne(transito);

            if(item){

                html +=
                '<span class="transito">TRÂNSITO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* NEWS */

        if(block === "news"){

            let geral =
            await getRSS(
            "https://g1.globo.com/rss/g1/"
            );

            geral = geral.filter(item =>
                item.title &&
                item.title.length > 20
            );

            let item =
            pickOne(geral);

            if(item){

                html +=
                '<span class="news">NEWS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* LUMIX */

        if(block === "lumix"){

            const frases = [

                "Impacto visual que vende",
                "Tecnologia visual de alto impacto",
                "Especialistas em painéis de LED"

            ];

            html +=
            '<span class="lumix">LUMIX LED</span> ' +
            frases[
            Math.floor(
            Math.random() * frases.length
            )] +
            '<span class="sep">◆</span>';

        }

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* INICIAR */

loadContent();


/* RELOAD CONTEÚDO */

setInterval(() => {

    loadContent();

}, 60000);


/* RELOAD TOTAL */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
