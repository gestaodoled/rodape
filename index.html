<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LUMIX NEWS STABLE</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:15%;
    height:100%;
    background:#C00000;
    color:#fff;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

#clock{
    position:absolute;
    left:15%;
    top:0;
    width:10%;
    height:100%;
    background:#111;
    color:#00FF99;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

#ticker{
    position:absolute;
    left:25%;
    top:0;
    width:75%;
    height:100%;
    overflow:hidden;
    white-space:nowrap;
    color:#fff;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 25s linear infinite;
}

.sep{color:#666;padding:0 14px;}

.esporte{color:#00FF00;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.news{color:#fff;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<div id="left-box">LUMIX</div>
<div id="clock"></div>
<div id="ticker"><div id="ticker-content">Carregando...</div></div>

<script>

/* CLOCK */
setInterval(()=>{
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
},1000);

/* SAFE FETCH RSS */
async function safeRSS(url){
    try{
        const res = await fetch(
        "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url),
        {timeout:4000}
        );
        const data = await res.json();
        return data.items || [];
    }catch{
        return [];
    }
}

/* TIMEOUT WRAPPER */
function timeoutPromise(promise, ms){
    return new Promise((resolve)=>{
        const t = setTimeout(()=>resolve([]), ms);
        promise.then(v=>{
            clearTimeout(t);
            resolve(v);
        }).catch(()=>resolve([]));
    });
}

/* ESPORTE (ROBUSTO) */
async function getEsporte(){

    const feeds = await Promise.all([
        timeoutPromise(safeRSS("https://ge.globo.com/rss/ge/futebol/"),4000),
        timeoutPromise(safeRSS("https://rss.uol.com.br/feed/esporte.xml"),4000)
    ]);

    let all = feeds.flat();

    if(!all.length){
        return "Futebol em atualização";
    }

    return all[Math.floor(Math.random()*all.length)].title;
}

/* TRÂNSITO SP (ROBUSTO) */
async function getTransito(){

    const feeds = await Promise.all([
        timeoutPromise(safeRSS("https://g1.globo.com/rss/g1/sao-paulo/"),4000),
        timeoutPromise(safeRSS("https://rss.uol.com.br/feed/noticias.xml"),4000)
    ]);

    let all = feeds.flat();

    let filtered = all.filter(i =>
        /trânsito|acidente|lentidão|marginal|sp|rodovia/i.test(i.title)
    );

    let pool = filtered.length ? filtered : all;

    if(!pool.length){
        return "SP fluindo normalmente";
    }

    return pool[Math.floor(Math.random()*pool.length)].title;
}

/* BUILD SAFE */
async function build(){

    let html = "";

    let esporte = await getEsporte();
    let transito = await getTransito();

    html += `<span class="esporte">ESPORTE</span> ${esporte}<span class="sep">◆</span>`;
    html += `<span class="transito">TRÂNSITO SP</span> ${transito}<span class="sep">◆</span>`;

    html += `<span class="news">NEWS</span> Atualizando informações<span class="sep">◆</span>`;
    html += `<span class="lumix">LUMIX</span> Sistema ativo<span class="sep">◆</span>`;

    document.getElementById("ticker-content").innerHTML = html;
}

/* START SAFE LOOP */
async function start(){

    try{
        await build();
    }catch(e){
        document.getElementById("ticker-content").innerHTML =
        `<span class="lumix">LUMIX</span> Sistema de fallback ativo<span class="sep">◆</span>`;
    }

}

start();

/* refresh seguro */
setInterval(start, 10000);

</script>

</body>
</html>
