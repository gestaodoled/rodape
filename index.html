<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' + configName + '.js?v=' + Date.now() + '"><\/script>'
);

let cycleCount = 0;

function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerHTML =
    String(now.getHours()).padStart(2,'0') + ":" +
    String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

function cleanText(text){
    if(!text) return "";
    const t = document.createElement("textarea");
    t.innerHTML = text;
    return t.value.replace(/[\n\r]/g," ").trim();
}

async function getRSS(url){
    try{
        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(url);

        const r = await fetch(api);
        const d = await r.json();
        return d.items || [];
    }catch{
        return [];
    }
}

/* FALLBACK INTELIGENTE */
function pickSmart(list){
    if(!list || list.length === 0) return null;
    return list[Math.floor(Math.random()*list.length)];
}

/* ESPORTE MULTI-FONTE */
async function getEsporte(){

    let feeds = [];

    const sources = [
        "https://ge.globo.com/rss/ge/futebol/",
        "https://rss.uol.com.br/feed/esporte.xml",
        "https://www.espn.com/espn/rss/soccer/news",
        "https://www.bbc.co.uk/sport/football/rss.xml"
    ];

    for(let url of sources){
        let data = await getRSS(url);
        feeds = feeds.concat(data);
    }

    return feeds;
}

/* TRÂNSITO SP MULTI-FONTE */
async function getTransito(){

    let feeds = [];

    const sources = [
        CONFIG.trafficRSS,
        "https://g1.globo.com/rss/g1/sao-paulo/",
        "https://rss.uol.com.br/feed/noticias.xml"
    ];

    for(let url of sources){
        let data = await getRSS(url);
        feeds = feeds.concat(data);
    }

    return feeds;
}

async function loadContent(){

    let html = "";

    const weather = {temp:22,max:28,min:19,code:0}; // simplificado
    const money = {usd:"5.20",eur:"6.10",btc:"590000"};

    for(let block of CONFIG.enabledBlocks){

        if(block === "esporte"){

            let data = await getEsporte();
            let item = pickSmart(data);

            if(item){
                html += `<span class="esporte">ESPORTE</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
            }
        }

        if(block === "transito"){

            let data = await getTransito();

            data = data.filter(i =>
                /trânsito|acidente|lentidão|marginal|sp|rodovia/i.test(i.title)
            );

            let item = pickSmart(data);

            if(item){
                html += `<span class="transito">TRÂNSITO SP</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
            }
        }

        if(block === "motivacao"){
            const frases = [
                "Consistência gera resultado",
                "Disciplina constrói futuro",
                "Foco vence talento"
            ];

            html += `<span class="motivacao">FOCO</span> ${pickSmart(frases)}<span class="sep">◆</span>`;
        }

        if(block === "dolar"){
            html += `<span class="dolar">DÓLAR</span> R$ ${money.usd}<span class="sep">◆</span>`;
        }

        if(block === "euro"){
            html += `<span class="euro">EURO</span> R$ ${money.eur}<span class="sep">◆</span>`;
        }

        if(block === "bitcoin"){
            html += `<span class="bitcoin">BITCOIN</span> R$ ${money.btc}<span class="sep">◆</span>`;
        }

    }

    document.getElementById("ticker-content").innerHTML = html;
}

loadContent();

setInterval(async ()=>{
    cycleCount++;
    if(cycleCount >= 2){
        cycleCount = 0;
        await loadContent();
    }
}, 6000);

</script>

</body>
</html>
