<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
BLOCO ESQUERDO
========================= */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* =========================
RELÓGIO
========================= */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* =========================
TICKER
========================= */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* =========================
CORES
========================= */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* =========================
ANIMAÇÃO
========================= */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- =========================
CONFIG DINÂMICA
========================= -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
Date.now() +
'"><\/script>'
);

</script>

<!-- =========================
SISTEMA
========================= -->

<script>

/* =========================
VISUAL
========================= */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

const leftWidth =
Math.round(CONFIG.width * 0.15);

const clockWidth =
Math.round(CONFIG.width * 0.09);

document.getElementById("left-box").style.width =
leftWidth + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
(leftWidth + 1) + "px";

document.getElementById("clock").style.width =
clockWidth + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
(leftWidth + clockWidth + 2) + "px";

document.getElementById("ticker").style.width =
(CONFIG.width - leftWidth - clockWidth - 2) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* =========================
RELÓGIO
========================= */

function updateClock(){

    const now =
    new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;

}

setInterval(updateClock,1000);

updateClock();


/* =========================
UTILS
========================= */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .replace(/\s+/g," ")
    .trim();

}

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =========================
RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        if(data.status === "ok"){

            return data.items || [];

        }

        return [];

    }catch(error){

        return [];

    }

}


/* =========================
CLIMA
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:20,
            max:25,
            min:18

        };

    }

}


/* =========================
MOEDAS
========================= */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =========================
LOAD CONTENT
========================= */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();


    async function addRSS(block, rssUrl, label){

        if(CONFIG.enabledBlocks.includes(block)){

            try{

                const rss =
                await getRSS(rssUrl);

                const item =
                pickOne(rss);

                if(item){

                    html +=
                    '<span class="' + block + '">' +
                    label +
                    '</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }catch(e){

            }

        }

    }


    /* CLIMA */

    if(CONFIG.enabledBlocks.includes("clima")){

        html +=
        '<span class="clima">CLIMA</span> ' +
        CONFIG.city +
        ' ' +
        weather.temp +
        '°C' +
        '<span class="sep">◆</span>';

    }


    /* PREVISÃO */

    if(CONFIG.enabledBlocks.includes("previsao")){

        html +=
        '<span class="previsao">PREVISÃO</span> Máx ' +
        weather.max +
        '° Mín ' +
        weather.min +
        '°' +
        '<span class="sep">◆</span>';

    }


    /* RSS DINÂMICOS */

    await addRSS(
    "transito",
    "https://g1.globo.com/rss/g1/sao-paulo/",
    "TRÂNSITO"
    );

    await addRSS(
    "rodovias",
    "https://g1.globo.com/rss/g1/sao-paulo/",
    "RODOVIAS"
    );

    await addRSS(
    "esporte",
    "https://ge.globo.com/rss/ge/futebol/",
    "ESPORTE"
    );

    await addRSS(
    "mercado",
    "https://g1.globo.com/rss/g1/economia/",
    "MERCADO"
    );

    await addRSS(
    "tech",
    "https://g1.globo.com/rss/g1/tecnologia/",
    "TECH"
    );

    await addRSS(
    "trending",
    "https://g1.globo.com/rss/g1/",
    "TRENDING"
    );

    await addRSS(
    "eventos",
    "https://g1.globo.com/rss/g1/pop-arte/",
    "EVENTOS"
    );

    await addRSS(
    "aeroportos",
    "https://g1.globo.com/rss/g1/sao-paulo/",
    "AEROPORTOS"
    );

    await addRSS(
    "megasena",
    "https://g1.globo.com/rss/g1/loterias/",
    "MEGA-SENA"
    );

    await addRSS(
    "saude",
    "https://g1.globo.com/rss/g1/bemestar/",
    "SAÚDE"
    );

    await addRSS(
    "alerta",
    "https://g1.globo.com/rss/g1/sao-paulo/",
    "ALERTA"
    );

    await addRSS(
    "entretenimento",
    "https://g1.globo.com/rss/g1/pop-arte/",
    "ENTRETENIMENTO"
    );

    await addRSS(
    "news",
    "https://g1.globo.com/rss/g1/",
    "NEWS"
    );


    /* DÓLAR */

    if(CONFIG.enabledBlocks.includes("dolar")){

        html +=
        '<span class="dolar">DÓLAR</span> R$ ' +
        money.usd +
        '<span class="sep">◆</span>';

    }


    /* EURO */

    if(CONFIG.enabledBlocks.includes("euro")){

        html +=
        '<span class="euro">EURO</span> R$ ' +
        money.eur +
        '<span class="sep">◆</span>';

    }


    /* BTC */

    if(CONFIG.enabledBlocks.includes("bitcoin")){

        html +=
        '<span class="bitcoin">BITCOIN</span> R$ ' +
        money.btc +
        '<span class="sep">◆</span>';

    }


    /* INSTAGRAM */

    if(CONFIG.enabledBlocks.includes("instagram")){

        html +=
        '<span class="instagram">INSTAGRAM</span> ' +
        CONFIG.instagram +
        '<span class="sep">◆</span>';

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* =========================
INICIAR
========================= */

loadContent();


/* =========================
ATUALIZA A CADA CICLO
========================= */

document
.getElementById("ticker-content")
.addEventListener(
"animationiteration",
async function(){

    await loadContent();

});

</script>

</body>
</html>
