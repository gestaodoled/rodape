<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1150, height=50">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:1150px;
    height:50px;
    font-family:Verdana,sans-serif;
}

#ticker{
    position:absolute;
    white-space:nowrap;
    color:#FFFFFF;
    font-size:28px;
    line-height:50px;
    padding-left:100%;
    animation:scroll 45s linear infinite;
}

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#666666;
    padding:0 20px;
}

#clock{
    position:absolute;
    right:15px;
    top:0;
    color:#00FFAA;
    font-size:24px;
    line-height:50px;
    font-weight:bold;
    z-index:2;
    background:#000000;
    padding-left:20px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }
}

</style>

</head>

<body>

<div id="clock"></div>

<div id="ticker">

    <span class="label">CLIMA</span>
    São Paulo 22°C ☀

    <span class="sep">|</span>

    <span class="label">ESPORTE</span>
    Palmeiras vence por 3x1

    <span class="sep">|</span>

    <span class="label">NOTÍCIAS</span>
    Mercado financeiro fecha em alta hoje

    <span class="sep">|</span>

    <span class="label">TRÂNSITO</span>
    Marginal Tietê com lentidão

</div>

<script>

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById('clock').innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
