<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>18 LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.politica{color:#FF4444;font-weight:bold;}
.mundo{color:#4FC3F7;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.agro{color:#8BC34A;font-weight:bold;}
.ciencia{color:#00E5FF;font-weight:bold;}
.games{color:#AA66CC;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<script>

/* VISUAL */
document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

const leftBox = document.getElementById("left-box");
const clock = document.getElementById("clock");
const ticker = document.getElementById("ticker");
const tickerContent = document.getElementById("ticker-content");

leftBox.style.width = Math.round(CONFIG.width * 0.15) + "px";
leftBox.style.height = CONFIG.height + "px";
leftBox.style.lineHeight = CONFIG.height + "px";
leftBox.style.fontSize = CONFIG.fontSize + "px";
leftBox.innerHTML = CONFIG.title;
leftBox.style.background = CONFIG.titleBackground || "#C00000";

clock.style.left = Math.round(CONFIG.width * 0.15 + 1) + "px";
clock.style.width = Math.round(CONFIG.width * 0.09) + "px";
clock.style.height = CONFIG.height + "px";
clock.style.lineHeight = CONFIG.height + "px";
clock.style.fontSize = CONFIG.fontSize + "px";

ticker.style.left = Math.round(CONFIG.width * 0.24) + "px";
ticker.style.width = Math.round(CONFIG.width * 0.76) + "px";
ticker.style.height = CONFIG.height + "px";
ticker.style.lineHeight = CONFIG.height + "px";
ticker.style.fontSize = CONFIG.fontSize + "px";

tickerContent.style.animationDuration = CONFIG.speed + "s";


/* CLOCK */
function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    clock.innerHTML = h + ":" + m;
}
setInterval(updateClock,1000);
updateClock();


/* CLEAN */
function cleanText(text){
    if(!text) return "";
    const t = document.createElement("textarea");
    t.innerHTML = text;
    return t.value.replace(/Â/g,"").replace(/[\n\r]/g," ").trim();
}


/* APIS */
const GNEWS_KEY = "9c1aaf5a12ad6ffe75f77c7fe15ad790";
const NEWSDATA_KEY = "pub_81dda51e603744ad9bfbb85b23339f46";


/* CACHE */
let NEWS_CACHE = [];
let TECH_CACHE = [];
let MARKET_CACHE = [];
let SPORT_CACHE = [];
let SELECAO_CACHE = [];
let RESULT_CACHE = [];

let POLITICA_CACHE = [];
let MUNDO_CACHE = [];
let ENTRETENIMENTO_CACHE = [];
let AGRO_CACHE = [];
let CIENCIA_CACHE = [];
let GAMES_CACHE = [];

let RESULT_INDEX = 0;


/* GNEWS */
async function getGNews(query){
    try{
        const url =
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&max=10&apikey=" +
        GNEWS_KEY;

        const r = await fetch(url);
        const d = await r.json();

        return d.articles || [];
    }catch(e){
        return [];
    }
}


/* SPORTS */
async function getSportsNews(query){
    try{
        const url =
        "https://newsdata.io/api/1/news?apikey=" +
        NEWSDATA_KEY +
        "&language=pt&category=sports&q=" +
        encodeURIComponent(query);

        const r = await fetch(url);
        const d = await r.json();

        return d.results || [];
    }catch(e){
        return [];
    }
}


/* LOAD NEWS */
async function loadNews(){

    NEWS_CACHE = await getGNews("brasil");
    TECH_CACHE = await getGNews("tecnologia");
    MARKET_CACHE = await getGNews("economia");

    POLITICA_CACHE = await getGNews("politica");
    MUNDO_CACHE = await getGNews("mundo");
    ENTRETENIMENTO_CACHE = await getGNews("entretenimento");
    AGRO_CACHE = await getGNews("agro");
    CIENCIA_CACHE = await getGNews("ciencia");
    GAMES_CACHE = await getGNews("games");

    SPORT_CACHE = await getSportsNews("futebol");
    SELECAO_CACHE = await getSportsNews("seleção brasileira");
}


/* RESULTS */
async function loadResults(){
    try{
        const r = await fetch(
        "https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4328"
        );

        const d = await r.json();
        RESULT_CACHE = d.events || [];

    }catch(e){
        RESULT_CACHE = [];
    }
}


/* RANDOM */
function pickOne(arr){
    if(!arr || !arr.length) return null;
    return arr[Math.floor(Math.random()*arr.length)];
}


/* CONTENT */
async function loadContent(){

    let html = "";

    const weather = await getWeather();
    const money = await getMoney();

    for(let block of CONFIG.enabledBlocks){

        try{

            if(block === "clima"){
                html += `<span class="clima">CLIMA</span> ${CONFIG.city} ${weather.temp}°C Máx ${weather.max}° Min ${weather.min}°<span class="sep">◆</span>`;
            }

            if(block === "politica"){
                const i = pickOne(POLITICA_CACHE);
                if(i?.title){
                    html += `<span class="politica">POLÍTICA</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "mundo"){
                const i = pickOne(MUNDO_CACHE);
                if(i?.title){
                    html += `<span class="mundo">MUNDO</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "entretenimento"){
                const i = pickOne(ENTRETENIMENTO_CACHE);
                if(i?.title){
                    html += `<span class="entretenimento">ENTRETENIMENTO</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "agro"){
                const i = pickOne(AGRO_CACHE);
                if(i?.title){
                    html += `<span class="agro">AGRO</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "ciencia"){
                const i = pickOne(CIENCIA_CACHE);
                if(i?.title){
                    html += `<span class="ciencia">CIÊNCIA</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "games"){
                const i = pickOne(GAMES_CACHE);
                if(i?.title){
                    html += `<span class="games">GAMES</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

            if(block === "news"){
                const i = pickOne(NEWS_CACHE);
                if(i?.title){
                    html += `<span class="news">NEWS</span> ${cleanText(i.title)}<span class="sep">◆</span>`;
                }
            }

        }catch(e){}

    }

    tickerContent.innerHTML = html;
}


/* START */
(async()=>{
    await loadNews();
    await loadContent();
})();


/* UPDATE */
tickerContent.addEventListener("animationiteration", async ()=>{
    await loadNews();
    await loadContent();
});


/* RELOAD */
setInterval(()=>location.reload(),1800000);

</script>

</body>
</html>
