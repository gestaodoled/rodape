<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX NEWS PRO MAX</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

/* cores */
.esporte{color:#00FF00;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.economia{color:#FFD700;font-weight:bold;}
.clima{color:#00FFFF;font-weight:bold;}
.sep{color:#666;padding:0 14px;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
<div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' + configName + '.js?v=' + Date.now() + '"><\/script>'
);

</script>

<script>

/* ================= CONFIG ================= */

document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("clock").style.width = Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("ticker").style.left = Math.round(CONFIG.width * 0.24) + "px";
document.getElementById("ticker").style.width = Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker-content").style.animationDuration = CONFIG.speed + "s";

/* ================= CLOCK ================= */

function updateClock(){
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* ================= RSS MULTI-FONTE ================= */

async function getRSS(url){

    try{

        const r = await fetch(url);
        const t = await r.text();

        const xml = new DOMParser().parseFromString(t,"text/xml");
        const items = xml.querySelectorAll("item");

        let out = [];

        items.forEach(i=>{
            out.push({
                title: i.querySelector("title")?.textContent || ""
            });
        });

        return out;

    }catch{
        return [];
    }
}

/* ================= FONTES ================= */

const FEEDS = {

esporte: [
"https://ge.globo.com/rss/ge/futebol/",
"https://feeds.folha.uol.com.br/esporte/rss091.xml"
],

news: [
"https://g1.globo.com/rss/g1/",
"https://feeds.folha.uol.com.br/emcimadahora/rss091.xml"
],

economia: [
"https://g1.globo.com/rss/g1/economia/",
"https://feeds.folha.uol.com.br/mercado/rss091.xml"
],

transito: [
CONFIG.trafficRSS
]

};

/* ================= CACHE ANTI-REPETIÇÃO ================= */

let last = {};

/* ================= PICK INTELIGENTE ================= */

function pick(arr,key){

    if(!arr.length) return null;

    let filtered = arr.filter(i => i.title !== last[key]);

    if(!filtered.length) filtered = arr;

    const item = filtered[Math.floor(Math.random()*filtered.length)];

    last[key] = item.title;

    return item;
}

/* ================= WEATHER + MONEY ================= */

async function getWeather(){
    try{
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=America%2FSao_Paulo`);
        const d = await r.json();

        return {
            temp: Math.round(d.current.temperature_2m),
        };

    }catch{
        return {temp:20};
    }
}

async function getMoney(){
    try{
        const r = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL");
        const d = await r.json();

        return {
            usd: parseFloat(d.USDBRL.bid).toFixed(2),
            eur: parseFloat(d.EURBRL.bid).toFixed(2),
            btc: Math.round(d.BTCBRL.bid)
        };

    }catch{
        return {usd:"5.40",eur:"6.10",btc:"580000"};
    }
}

/* ================= LOAD ================= */

async function load(){

    let html = "";

    const weather = await getWeather();
    const money = await getMoney();

    for(let block of CONFIG.enabledBlocks){

        /* ESPORTE MULTIFONTE */
        if(block==="esporte"){

            let all = [];

            for(let f of FEEDS.esporte){
                let data = await getRSS(f);
                all = all.concat(data);
            }

            let item = pick(all,"esporte");

            if(item){
                html += `<span class="esporte">ESPORTE</span> ${item.title}<span class="sep">◆</span>`;
            }
        }

        /* NEWS MULTIFONTE */
        if(block==="news"){

            let all = [];

            for(let f of FEEDS.news){
                let data = await getRSS(f);
                all = all.concat(data);
            }

            let item = pick(all,"news");

            if(item){
                html += `<span class="news">NEWS</span> ${item.title}<span class="sep">◆</span>`;
            }
        }

        /* ECONOMIA */
        if(block==="dolar"){
            html += `<span class="economia">DÓLAR</span> R$ ${money.usd}<span class="sep">◆</span>`;
        }

        if(block==="euro"){
            html += `<span class="economia">EURO</span> R$ ${money.eur}<span class="sep">◆</span>`;
        }

        if(block==="bitcoin"){
            html += `<span class="economia">BITCOIN</span> R$ ${money.btc}<span class="sep">◆</span>`;
        }

        /* CLIMA */
        if(block==="clima"){
            html += `<span class="clima">CLIMA</span> ${CONFIG.city} ${weather.temp}°C<span class="sep">◆</span>`;
        }

    }

    document.getElementById("ticker-content").innerHTML = html;
}

load();

/* LOOP */
setInterval(load,60000);

</script>

</body>
</html>
