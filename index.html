<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1150, height=50">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:1150px;
    height:50px;
    font-family:Verdana,sans-serif;
}

#ticker{
    position:absolute;
    white-space:nowrap;
    color:#FFFFFF;
    font-size:28px;
    line-height:50px;
    padding-left:100%;
    animation:scroll 90s linear infinite;
}

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#666666;
    padding:0 20px;
}

#clock{
    position:absolute;
    right:15px;
    top:0;
    color:#00FFAA;
    font-size:24px;
    line-height:50px;
    font-weight:bold;
    z-index:2;
    background:#000000;
    padding-left:20px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }
}

</style>

</head>

<body>

<div id="clock"></div>

<div id="ticker">
Carregando notícias...
</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById('clock').innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   NOTÍCIAS RSS
========================= */

async function loadNews(){

    try{

        const rssUrl =
        "https://g1.globo.com/rss/g1/";

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response = await fetch(api);

        const data = await response.json();

        let html = "";

        data.items.slice(0,10).forEach(item => {

            html +=
            '<span class="label">NOTÍCIAS</span> ' +
            item.title +
            '<span class="sep">|</span>';

        });

        document.getElementById("ticker").innerHTML =
        html;

    }catch(error){

        document.getElementById("ticker").innerHTML =
        "Erro ao carregar notícias.";

    }

}

loadNews();

/* Atualiza notícias a cada 10 minutos */

setInterval(loadNews,600000);

</script>

</body>
</html>
