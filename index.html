<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{
from{transform:translateX(0);}
to{transform:translateX(-100%);}
}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
<div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write('<script src="configs/' + configName + '.js"><\/script>');

</script>

<script>

/* ================= CONFIG VISUAL ================= */

document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("clock").style.width = Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("ticker").style.left = Math.round(CONFIG.width * 0.24) + "px";
document.getElementById("ticker").style.width = Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker-content").style.animationDuration = CONFIG.speed + "s";

/* ================= CLOCK ================= */

setInterval(()=>{
const now = new Date();
document.getElementById("clock").innerHTML =
String(now.getHours()).padStart(2,'0') + ":" +
String(now.getMinutes()).padStart(2,'0');
},1000);

/* ================= RSS ================= */

async function getRSS(url){

try{

const api =
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(url);

const response = await fetch(api);
const data = await response.json();

return data.items || [];

}catch(e){
return [];
}

}

/* ================= HELPERS ================= */

function pickOne(items){

if(!items || !items.length) return null;

return items[Math.floor(Math.random() * items.length)];

}

function cleanText(text){

if(!text) return "";

const txt = document.createElement("textarea");
txt.innerHTML = text;

return txt.value
.replace(/Â/g,"")
.replace(/[\n\r]/g," ")
.trim();

}

/* ================= LOAD ================= */

async function loadContent(){

let html = "";

const newsFontes = [
"https://g1.globo.com/rss/g1/",
"https://rss.uol.com.br/feed/noticias.xml",
"https://www1.folha.uol.com.br/feed/rss",
"https://www.cnnbrasil.com.br/feed/"
];

let noticias = [];

for(let url of newsFontes){

try{
let data = await getRSS(url);
noticias = noticias.concat(data);
}catch(e){}

}

/* limpa notícias ruins */
noticias = noticias.filter(n => n.title && n.title.length > 20);

for(let block of CONFIG.enabledBlocks){

/* CLIMA */
if(block === "clima"){
html += '<span class="clima">CLIMA</span> ' + CONFIG.city + '<span class="sep">◆</span>';
}

/* ESPORTE */
if(block === "esporte"){
let esporte = await getRSS("https://ge.globo.com/rss/ge/futebol/");
let item = pickOne(esporte);
if(item){
html += '<span class="esporte">ESPORTE</span> ' + cleanText(item.title) + '<span class="sep">◆</span>';
}
}

/* TRÂNSITO */
if(block === "transito"){
let transito = await getRSS(CONFIG.trafficRSS);
let item = pickOne(transito);
if(item){
html += '<span class="transito">TRÂNSITO</span> ' + cleanText(item.title) + '<span class="sep">◆</span>';
}
}

/* NEWS BASE */
if(block === "news"){
let geral = await getRSS("https://g1.globo.com/rss/g1/");
let item = pickOne(geral);
if(item){
html += '<span class="news">NEWS</span> ' + cleanText(item.title) + '<span class="sep">◆</span>';
}
}

/* 🧠 NEWS FORTE (NOVO MULTI-FONTE) */
if(block === "news_forte"){

let item = pickOne(noticias);

if(item){
html += '<span class="news">NEWS</span> ' + cleanText(item.title) + '<span class="sep">◆</span>';
}

}

}

document.getElementById("ticker-content").innerHTML = html;

}

/* ================= START ================= */

loadContent();
setInterval(loadContent, 60000);

</script>

</body>
</html>
