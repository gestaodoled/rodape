<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS TESTE NOVO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- CONFIG -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<!-- SISTEMA -->

<script>

/* CONFIG VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* CONTADOR */

let cycleCount = 0;


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* CONTROLE REPETIÇÃO */

const usedTitles = new Set();


/* FILTRO */

function filterNews(items, keywords){

    const filtered =
    items.filter(item => {

        if(!item.title) return false;

        const title =
        item.title.toLowerCase();

        return keywords.some(word =>
        title.includes(word)
        );

    });

    if(filtered.length === 0){

        return items;

    }

    return filtered;

}


/* ITEM ÚNICO */

function pickUnique(items){

    if(!items || items.length === 0){

        return null;

    }

    const filtered =
    items.filter(item => {

        if(!item.title) return false;

        const title =
        item.title.toLowerCase();

        return !usedTitles.has(title);

    });

    if(filtered.length === 0){

        usedTitles.clear();

        return items[
        Math.floor(
        Math.random() * items.length
        )];

    }

    const item =
    filtered[
    Math.floor(
    Math.random() * filtered.length
    )];

    usedTitles.add(
    item.title.toLowerCase()
    );

    return item;

}


/* RSS */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0]),

            code:
            data.current.weather_code

        };

    }catch(error){

        return {

            temp:20,
            max:25,
            min:18,
            code:0

        };

    }

}


/* ALERTAS */

function getWeatherAlert(code){

    if(code >= 95){

        return "Alerta de tempestade";

    }

    if(code >= 80){

        return "Alerta de chuva forte";

    }

    if(code >= 61){

        return "Possibilidade de chuva";

    }

    if(code >= 45){

        return "Neblina na região";

    }

    return null;

}


/* MOEDAS */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* LOAD */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();


    for(let block of CONFIG.enabledBlocks){

        /* CLIMA */

        if(block === "clima"){

            html +=
            '<span class="clima">CLIMA</span> ' +
            CONFIG.city + ' ' +
            weather.temp +
            '°C' +
            '<span class="sep">◆</span>';

        }


        /* PREVISÃO */

        if(block === "previsao"){

            html +=
            '<span class="previsao">PREVISÃO</span> Máx ' +
            weather.max +
            '° Mín ' +
            weather.min +
            '°' +
            '<span class="sep">◆</span>';

        }


        /* ESPORTE ENTRE PREVISÃO E DÓLAR */

        if(block === "esporte"){

            let esporte =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/"
            );

            let item =
            pickUnique(esporte);

            if(item){

                html +=
                '<span class="esporte">ESPORTE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* DÓLAR */

        if(block === "dolar"){

            html +=
            '<span class="dolar">DÓLAR</span> R$ ' +
            money.usd +
            '<span class="sep">◆</span>';

        }


        /* EURO */

        if(block === "euro"){

            html +=
            '<span class="euro">EURO</span> R$ ' +
            money.eur +
            '<span class="sep">◆</span>';

        }


        /* BITCOIN */

        if(block === "bitcoin"){

            html +=
            '<span class="bitcoin">BITCOIN</span> R$ ' +
            money.btc +
            '<span class="sep">◆</span>';

        }


        /* TRÂNSITO */

        if(block === "transito"){

            let transito =
            await getRSS(CONFIG.trafficRSS);

            transito =
            filterNews(transito,[

                "trânsito",
                "transito",
                "acidente",
                "lentidão",
                "engarrafamento",
                "marginal"

            ]);

            let item =
            pickUnique(transito);

            if(item){

                html +=
                '<span class="transito">TRÂNSITO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* RODOVIAS */

        if(block === "rodovias"){

            let rodovias =
            await getRSS(CONFIG.trafficRSS);

            rodovias =
            filterNews(rodovias,[

                "rodovia",
                "anchieta",
                "imigrantes",
                "castello",
                "anhanguera",
                "bandeirantes"

            ]);

            let item =
            pickUnique(rodovias);

            if(item){

                html +=
                '<span class="rodovias">RODOVIAS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* MERCADO */

        if(block === "mercado"){

            let mercado =
            await getRSS(
            "https://g1.globo.com/rss/g1/economia/"
            );

            let item =
            pickUnique(mercado);

            if(item){

                html +=
                '<span class="mercado">MERCADO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* TECH */

        if(block === "tech"){

            let tech =
            await getRSS(
            "https://g1.globo.com/rss/g1/tecnologia/"
            );

            let item =
            pickUnique(tech);

            if(item){

                html +=
                '<span class="tech">TECH</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* TRENDING */

        if(block === "trending"){

            let trends =
            await getRSS(
            "https://rss.uol.com.br/feed/tecnologia.xml"
            );

            let item =
            pickUnique(trends);

            if(item){

                html +=
                '<span class="trending">TRENDING</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* EVENTOS */

        if(block === "eventos"){

            let eventos =
            await getRSS(
            "https://g1.globo.com/rss/g1/pop-arte/"
            );

            let item =
            pickUnique(eventos);

            if(item){

                html +=
                '<span class="eventos">EVENTOS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* AEROPORTOS */

        if(block === "aeroportos"){

            let aeroportos =
            await getRSS(
            "https://g1.globo.com/rss/g1/economia/"
            );

            aeroportos =
            filterNews(aeroportos,[

                "aeroporto",
                "voo",
                "avião",
                "congonhas",
                "guarulhos",
                "viracopos"

            ]);

            let item =
            pickUnique(aeroportos);

            if(item){

                html +=
                '<span class="aeroportos">AEROPORTOS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* MEGA-SENA */

        if(block === "megasena"){

            try{

                const response =
                await fetch(
                "https://servicebus2.caixa.gov.br/portaldeloterias/api/megasena"
                );

                const data =
                await response.json();

                html +=
                '<span class="megasena">MEGA-SENA</span> Concurso ' +
                data.numero +
                ' prêmio estimado R$ ' +
                Number(
                data.valorEstimadoProximoConcurso
                ).toLocaleString('pt-BR') +
                '<span class="sep">◆</span>';

            }catch(error){

            }

        }


        /* SAÚDE */

        if(block === "saude"){

            let saude =
            await getRSS(
            "https://g1.globo.com/rss/g1/bemestar/"
            );

            let item =
            pickUnique(saude);

            if(item){

                html +=
                '<span class="saude">SAÚDE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* ALERTA */

        if(block === "alerta"){

            const alertText =
            getWeatherAlert(weather.code);

            if(alertText){

                html +=
                '<span class="alerta">ALERTA</span> ' +
                alertText +
                '<span class="sep">◆</span>';

            }

        }


        /* ENTRETENIMENTO */

        if(block === "entretenimento"){

            let entretenimento =
            await getRSS(
            "https://g1.globo.com/rss/g1/pop-arte/"
            );

            let item =
            pickUnique(entretenimento);

            if(item){

                html +=
                '<span class="entretenimento">ENTRETENIMENTO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* NEWS */

        if(block === "news"){

            let geral =
            await getRSS(
            "https://g1.globo.com/rss/g1/"
            );

            let item =
            pickUnique(geral);

            if(item){

                html +=
                '<span class="news">NEWS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* INSTAGRAM */

        if(block === "instagram"){

            html +=
            '<span class="instagram">INSTAGRAM</span> ' +
            CONFIG.instagram +
            '<span class="sep">◆</span>';

        }

    }

    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* INICIAR */

loadContent();


/* ATUALIZA APÓS 2 CICLOS */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});


/* RELOAD AUTOMÁTICO */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
