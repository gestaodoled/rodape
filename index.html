<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS STABLE</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- CONFIG -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<!-- SISTEMA -->

<script>

/* VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;

}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    return text
    .replace(/<[^>]*>/g,'')
    .replace(/&[^;]+;/g,' ')
    .replace(/\s+/g,' ')
    .trim();

}


/* TIMEOUT */

function fetchWithTimeout(url, timeout = 8000){

    return Promise.race([

        fetch(url),

        new Promise((_, reject) =>
            setTimeout(() =>
            reject(new Error("timeout")),
            timeout)
        )

    ]);

}


/* RSS */

async function getRSS(rssUrl){

    try{

        const proxy =
        "https://api.codetabs.com/v1/proxy/?quest=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetchWithTimeout(proxy);

        const xmlText =
        await response.text();

        const parser =
        new DOMParser();

        const xml =
        parser.parseFromString(
        xmlText,
        "text/xml"
        );

        const items =
        [...xml.querySelectorAll("item")];

        return items.map(item => ({

            title:
            item.querySelector("title")?.textContent || ""

        }));

    }catch(error){

        return [];

    }

}


/* ITEM */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0]),

            code:
            data.current.weather_code

        };

    }catch(error){

        return {

            temp:20,
            max:25,
            min:18,
            code:0

        };

    }

}


/* ALERTAS */

function getWeatherAlert(code){

    if(code >= 95){

        return "Tempestades previstas";

    }

    if(code >= 80){

        return "Chuva forte prevista";

    }

    if(code >= 61){

        return "Possibilidade de chuva";

    }

    return null;

}


/* MOEDAS */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* LOAD */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();


    for(let block of CONFIG.enabledBlocks){

        try{

            if(block === "clima"){

                html +=
                '<span class="clima">CLIMA</span> ' +
                CONFIG.city + ' ' +
                weather.temp +
                '°C' +
                '<span class="sep">◆</span>';

            }


            if(block === "previsao"){

                html +=
                '<span class="previsao">PREVISÃO</span> Máx ' +
                weather.max +
                '° Mín ' +
                weather.min +
                '°' +
                '<span class="sep">◆</span>';

            }


            if(block === "esporte"){

                let esporte =
                await getRSS(
                "https://ge.globo.com/rss/ge/futebol/"
                );

                let item =
                pickOne(esporte);

                if(item){

                    html +=
                    '<span class="esporte">ESPORTE</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }


            if(block === "news"){

                let news =
                await getRSS(
                "https://g1.globo.com/rss/g1/"
                );

                let item =
                pickOne(news);

                if(item){

                    html +=
                    '<span class="news">NEWS</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }


            if(block === "mercado"){

                let mercado =
                await getRSS(
                "https://g1.globo.com/rss/g1/economia/"
                );

                let item =
                pickOne(mercado);

                if(item){

                    html +=
                    '<span class="mercado">MERCADO</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }


            if(block === "tech"){

                let tech =
                await getRSS(
                "https://g1.globo.com/rss/g1/tecnologia/"
                );

                let item =
                pickOne(tech);

                if(item){

                    html +=
                    '<span class="tech">TECH</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }


            if(block === "entretenimento"){

                let entretenimento =
                await getRSS(
                "https://g1.globo.com/rss/g1/pop-arte/"
                );

                let item =
                pickOne(entretenimento);

                if(item){

                    html +=
                    '<span class="entretenimento">ENTRETENIMENTO</span> ' +
                    cleanText(item.title) +
                    '<span class="sep">◆</span>';

                }

            }


            if(block === "dolar"){

                html +=
                '<span class="dolar">DÓLAR</span> R$ ' +
                money.usd +
                '<span class="sep">◆</span>';

            }


            if(block === "euro"){

                html +=
                '<span class="euro">EURO</span> R$ ' +
                money.eur +
                '<span class="sep">◆</span>';

            }


            if(block === "bitcoin"){

                html +=
                '<span class="bitcoin">BITCOIN</span> R$ ' +
                money.btc +
                '<span class="sep">◆</span>';

            }


            if(block === "instagram"){

                html +=
                '<span class="instagram">INSTAGRAM</span> ' +
                CONFIG.instagram +
                '<span class="sep">◆</span>';

            }


            if(block === "alerta"){

                const alertText =
                getWeatherAlert(weather.code);

                if(alertText){

                    html +=
                    '<span class="alerta">ALERTA</span> ' +
                    alertText +
                    '<span class="sep">◆</span>';

                }

            }

        }catch(error){

            console.log(
            "Erro bloco:",
            block
            );

        }

    }


    if(html.trim() === ""){

        html =
        '<span class="news">Sistema online</span>';

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* START */

loadContent();


/* UPDATE */

setInterval(() => {

    loadContent();

}, 120000);

</script>

</body>
</html>
