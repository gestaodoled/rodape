<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX SAFE</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}

#left-box,#clock,#ticker{
position:absolute;top:0;height:100%;
display:flex;align-items:center;justify-content:center;
font-weight:bold;
}

#left-box{left:0;width:15%;background:#c00}
#clock{left:15%;width:10%;background:#111;color:#0f0}
#ticker{left:25%;width:75%;overflow:hidden;white-space:nowrap}

#ticker-content{
display:inline-block;
white-space:nowrap;
padding-left:100%;
animation:scroll 20s linear infinite;
}

.sep{color:#666;padding:0 14px}
.esporte{color:#0f0}
.transito{color:#ffa500}
.lumix{color:#ffd700}

@keyframes scroll{
from{transform:translateX(0)}
to{transform:translateX(-100%)}
}
</style>
</head>

<body>

<div id="left-box">LUMIX</div>
<div id="clock"></div>
<div id="ticker"><div id="ticker-content">Inicializando...</div></div>

<script>

/* 🔥 PROTEÇÃO TOTAL DE CONFIG */
window.CONFIG = window.CONFIG || {
    width: 1920,
    height: 1080,
    fontSize: 40,
    title: "LUMIX",
    enabledBlocks: ["esporte","transito"]
};

/* CLOCK */
setInterval(()=>{
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
},1000);

/* RSS SAFE */
async function rss(url){
    try{
        const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url));
        const d = await r.json();
        return d.items || [];
    }catch{
        return [];
    }
}

function pick(a){
    if(!a || !a.length) return null;
    return a[Math.floor(Math.random()*a.length)];
}

/* ESPORTE (SEMPRE FUNCIONA) */
async function esporte(){
    let data = await rss("https://ge.globo.com/rss/ge/futebol/");
    let item = pick(data);
    return item ? item.title : "Futebol em atualização";
}

/* TRÂNSITO (SEMPRE FUNCIONA) */
async function transito(){
    let data = await rss("https://g1.globo.com/rss/g1/sao-paulo/");
    let item = pick(data);
    return item ? item.title : "SP fluindo normalmente";
}

/* BUILD */
async function build(){

    let html = "";

    let esp = await esporte();
    let tra = await transito();

    html += `<span class="esporte">ESPORTE</span> ${esp}<span class="sep">◆</span>`;
    html += `<span class="transito">TRÂNSITO SP</span> ${tra}<span class="sep">◆</span>`;
    html += `<span class="lumix">LUMIX</span> Sistema ativo<span class="sep">◆</span>`;

    document.getElementById("ticker-content").innerHTML = html || "Sistema ativo";
}

build();
setInterval(build,10000);

</script>

</body>
</html>
