<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>8 LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<script>

/* CONFIG VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* CONTADOR */

let cycleCount = 0;


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    let result = txt.value;

    result = result
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

    return result;

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:22,
            max:28,
            min:18

        };

    }

}


/* MOEDAS */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.40",
            eur:"6.10",
            btc:"580000"

        };

    }

}


/* GNEWS */

const GNEWS_KEY =
"9c1aaf5a12ad6ffe75f77c7fe15ad790";

let NEWS_CACHE = [];
let TECH_CACHE = [];
let MARKET_CACHE = [];
let SPORT_CACHE = [];
let SELECAO_CACHE = [];

async function getGNews(query){

    try{

        const url =
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&country=br&max=10&apikey=" +
        GNEWS_KEY;

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(data.articles){

            return data.articles;

        }

        return [];

    }catch(error){

        return [];

    }

}


async function loadGNews(){

    NEWS_CACHE =
    await getGNews("noticias brasil");

    TECH_CACHE =
    await getGNews("tecnologia");

    MARKET_CACHE =
    await getGNews("economia mercado");

    SPORT_CACHE =
    await getGNews("futebol brasileiro champions league premier league");

    SELECAO_CACHE =
    await getGNews("seleção brasileira futebol");

}


/* RESULTADOS */

let RESULT_CACHE = [];

async function loadSports(){

    try{

        const response =
        await fetch(
        "https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4328"
        );

        const data =
        await response.json();

        RESULT_CACHE =
        data.events || [];

    }catch(error){

        RESULT_CACHE = [];

    }

}


/* ITEM ALEATÓRIO */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* LOAD */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();


    for(let block of CONFIG.enabledBlocks){

        /* CLIMA */

        if(block === "clima"){

            html +=
            '<span class="clima">CLIMA</span> ' +
            CONFIG.city + ' ' +
            weather.temp +
            '°C Máx ' +
            weather.max +
            '° Min ' +
            weather.min +
            '°' +
            '<span class="sep">◆</span>';

        }


        /* ESPORTE */

        if(block === "esporte"){

            if(SPORT_CACHE.length){

                const item =
                pickOne(SPORT_CACHE);

                html +=
                '<span class="esporte">ESPORTE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }else{

                html +=
                '<span class="esporte">ESPORTE</span> Futebol brasileiro e europeu em destaque' +
                '<span class="sep">◆</span>';

            }

        }


        /* RESULTADOS */

        if(block === "resultados"){

            if(RESULT_CACHE.length){

                const jogo =
                pickOne(RESULT_CACHE);

                html +=
                '<span class="resultados">RESULTADOS</span> ' +
                jogo.strHomeTeam +
                ' ' +
                jogo.intHomeScore +
                'x' +
                jogo.intAwayScore +
                ' ' +
                jogo.strAwayTeam +
                '<span class="sep">◆</span>';

            }

        }


        /* SELEÇÃO */

        if(block === "selecao"){

            if(SELECAO_CACHE.length){

                const item =
                pickOne(SELECAO_CACHE);

                html +=
                '<span class="selecao">SELEÇÃO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* CLASSIFICAÇÃO */

        if(block === "classificacao"){

            try{

                const response =
                await fetch(
                "https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=4328&s=2025-2026"
                );

                const data =
                await response.json();

                if(data.table && data.table.length >= 3){

                    const p1 = data.table[0];
                    const p2 = data.table[1];
                    const p3 = data.table[2];

                    html +=
                    '<span class="classificacao">CLASSIFICAÇÃO</span> Premier League: ' +
                    '1º ' + p1.strTeam +
                    ' (' + p1.intPoints + ' pts) | ' +
                    '2º ' + p2.strTeam +
                    ' (' + p2.intPoints + ' pts) | ' +
                    '3º ' + p3.strTeam +
                    ' (' + p3.intPoints + ' pts)' +
                    '<span class="sep">◆</span>';

                }

            }catch(error){

                html +=
                '<span class="classificacao">CLASSIFICAÇÃO</span> Premier League em atualização' +
                '<span class="sep">◆</span>';

            }

        }


        /* DÓLAR */

        if(block === "dolar"){

            html +=
            '<span class="dolar">DÓLAR</span> R$ ' +
            money.usd +
            '<span class="sep">◆</span>';

        }


        /* EURO */

        if(block === "euro"){

            html +=
            '<span class="euro">EURO</span> R$ ' +
            money.eur +
            '<span class="sep">◆</span>';

        }


        /* BITCOIN */

        if(block === "bitcoin"){

            html +=
            '<span class="bitcoin">BITCOIN</span> R$ ' +
            money.btc +
            '<span class="sep">◆</span>';

        }


        /* MERCADO */

        if(block === "mercado"){

            if(MARKET_CACHE.length){

                const item =
                pickOne(MARKET_CACHE);

                html +=
                '<span class="mercado">MERCADO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* TECH */

        if(block === "tech"){

            if(TECH_CACHE.length){

                const item =
                pickOne(TECH_CACHE);

                html +=
                '<span class="tech">TECH</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* NEWS */

        if(block === "news"){

            if(NEWS_CACHE.length){

                const item =
                pickOne(NEWS_CACHE);

                html +=
                '<span class="news">NEWS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* LUMIX */

        if(block === "lumix"){

            const lumix = [

                "Impacto visual que vende",
                "Especialistas em painéis de LED",
                "Tecnologia visual de alto impacto"

            ];

            html +=
            '<span class="lumix">LUMIX LED</span> ' +
            lumix[
            Math.floor(
            Math.random() * lumix.length
            )] +
            '<span class="sep">◆</span>';

        }


        /* INSTAGRAM */

        if(block === "instagram"){

            html +=
            '<span class="instagram">INSTAGRAM</span> ' +
            CONFIG.instagram +
            '<span class="sep">◆</span>';

        }

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* INICIAR */

(async () => {

    await loadGNews();

    await loadSports();

    await loadContent();

})();


/* ATUALIZA */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadGNews();

        await loadSports();

        await loadContent();

    }

});


/* RELOAD */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
