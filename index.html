# Rodapé LED Dinâmico — São Paulo

```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=30">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* ÁREA DAS NOTÍCIAS */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* TEXTO ANIMADO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 220s linear infinite;
}

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#777;
    padding:0 18px;
}

.temp{
    color:#00D9FF;
    font-weight:bold;
}

.esporte{
    color:#00FF99;
    font-weight:bold;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">
        Carregando informações...
    </div>
</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   CONTEÚDO DINÂMICO
========================= */

async function loadContent(){

    try{

        /* RSS G1 */

        const rssUrl =
        "https://g1.globo.com/rss/g1/";

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response = await fetch(api);

        const data = await response.json();

        let html = "";

        /* TEMPO FIXO */

        html +=
        '<span class="label">CLIMA SP</span> ' +
        '<span class="temp">18°C ☁</span>' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">PREVISÃO</span> ' +
        'Máx 24°C / Mín 16°C' +
        '<span class="sep">◆</span>';


        /* ESPORTES */

        html +=
        '<span class="label">BRASILEIRÃO</span> ' +
        '<span class="esporte">Palmeiras</span> 1º' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">SERIE A</span> ' +
        'Corinthians 6º | São Paulo 8º | Santos 12º' +
        '<span class="sep">◆</span>';


        /* NOTÍCIAS */

        data.items.slice(0,10).forEach(item => {

            html +=
            '<span class="label">NEWS</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });


        /* DUPLICAÇÃO PARA LOOP */

        document.getElementById("ticker-content").innerHTML =
            html + html;

    }catch(error){

        document.getElementById("ticker-content").innerHTML =
            "Erro ao carregar informações.";

    }

}

loadContent();

/* Atualiza a cada 10 minutos */

setInterval(loadContent,600000);

</script>

</body>
</html>
```
