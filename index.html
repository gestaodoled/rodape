<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- CONFIG -->

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<!-- SISTEMA -->

<script>

/* =========================
CONFIG VISUAL
========================= */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* =========================
RELÓGIO
========================= */

async function updateClock(){

    try{

        const response =
        await fetch(
        "https://worldtimeapi.org/api/timezone/America/Sao_Paulo"
        );

        const data =
        await response.json();

        const now =
        new Date(data.datetime);

        const hours =
        String(now.getHours()).padStart(2,'0');

        const minutes =
        String(now.getMinutes()).padStart(2,'0');

        document.getElementById("clock").innerHTML =
        hours + ":" + minutes;

    }catch(error){

        const now =
        new Date();

        document.getElementById("clock").innerHTML =
        now.toLocaleTimeString(
        'pt-BR',
        {
            hour:'2-digit',
            minute:'2-digit'
        });

    }

}

setInterval(updateClock,60000);

updateClock();


/* =========================
LIMPA TEXTO
========================= */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

}


/* =========================
RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =========================
ITEM ALEATÓRIO
========================= */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =========================
CLIMA
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            feels:
            Math.round(data.current.apparent_temperature),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:20,
            feels:20,
            max:25,
            min:18

        };

    }

}


/* =========================
COTAÇÕES
========================= */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =========================
LIGAS
========================= */

const leagues = [

    {id:4328,name:"Premier League"},
    {id:4335,name:"La Liga"},
    {id:4331,name:"Bundesliga"},
    {id:4332,name:"Serie A"},
    {id:4340,name:"Brasileirão"}

];

function getRandomLeague(){

    return leagues[
    Math.floor(
    Math.random() * leagues.length
    )];

}


/* =========================
RESULTADOS
========================= */

async function getResults(){

    try{

        const league =
        getRandomLeague();

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=${league.id}`
        );

        const data =
        await response.json();

        if(!data.events) return null;

        const validGames =
        data.events.filter(game =>

            game.intHomeScore !== null &&
            game.intAwayScore !== null

        );

        if(validGames.length === 0)
        return null;

        const game =
        pickOne(validGames);

        return (
            league.name +
            ' • ' +
            game.strHomeTeam +
            ' ' +
            game.intHomeScore +
            'x' +
            game.intAwayScore +
            ' ' +
            game.strAwayTeam
        );

    }catch(error){

        return null;

    }

}


/* =========================
PRÓXIMOS JOGOS
========================= */

async function getNextGames(){

    try{

        const league =
        getRandomLeague();

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${league.id}`
        );

        const data =
        await response.json();

        if(!data.events) return null;

        const game =
        pickOne(data.events);

        const time =
        game.strTime
        ? game.strTime.substring(0,5)
        : "--:--";

        return (
            league.name +
            ' • ' +
            game.strHomeTeam +
            ' x ' +
            game.strAwayTeam +
            ' ' +
            time
        );

    }catch(error){

        return null;

    }

}


/* =========================
CLASSIFICAÇÃO
========================= */

async function getStandings(){

    try{

        const league =
        getRandomLeague();

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=${league.id}&s=2025-2026`
        );

        const data =
        await response.json();

        if(!data.table) return null;

        const top4 =
        data.table.slice(0,4);

        let text =
        league.name + ' • ';

        top4.forEach((team,index) => {

            const name =
            team.name ||
            team.strTeam ||
            "Time";

            const points =
            team.intPoints || 0;

            text +=
            `${index+1}° ${name} ${points} pts`;

            if(index < 3){

                text += ' • ';

            }

        });

        return text;

    }catch(error){

        return null;

    }

}


/* =========================
LOAD CONTENT
========================= */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();

    for(let block of CONFIG.enabledBlocks){

        /* CLIMA */

        if(block === "clima"){

            html +=
            '<span class="clima">CLIMA</span> ' +
            CONFIG.city +
            ' ' +
            weather.temp +
            '°C Sensação ' +
            weather.feels +
            '°' +
            '<span class="sep">◆</span>';

        }


        /* PREVISÃO */

        if(block === "previsao"){

            html +=
            '<span class="previsao">PREVISÃO</span> Máx ' +
            weather.max +
            '° Mín ' +
            weather.min +
            '°' +
            '<span class="sep">◆</span>';

        }


        /* TRÂNSITO */

        if(block === "transito"){

            let transito =
            await getRSS(CONFIG.trafficRSS);

            transito =
            transito.filter(item => {

                const t =
                item.title.toLowerCase();

                return t.includes("trânsito") ||
                       t.includes("transito") ||
                       t.includes("acidente") ||
                       t.includes("lentidão");

            });

            const item =
            pickOne(transito);

            if(item){

                html +=
                '<span class="transito">TRÂNSITO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* ESPORTE */

        if(block === "esporte"){

            let esporte =
            await getRSS(
            "https://ge.globo.com/rss/ge/futebol/"
            );

            const item =
            pickOne(esporte);

            if(item){

                html +=
                '<span class="esporte">ESPORTE</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* RESULTADOS */

        if(block === "resultados"){

            const result =
            await getResults();

            if(result){

                html +=
                '<span class="resultados">RESULTADOS</span> ' +
                result +
                '<span class="sep">◆</span>';

            }

        }


        /* PRÓXIMOS JOGOS */

        if(block === "proximosJogos"){

            const next =
            await getNextGames();

            if(next){

                html +=
                '<span class="esporte">PRÓXIMOS JOGOS</span> ' +
                next +
                '<span class="sep">◆</span>';

            }

        }


        /* CLASSIFICAÇÃO */

        if(block === "classificacao"){

            const standing =
            await getStandings();

            if(standing){

                html +=
                '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
                standing +
                '<span class="sep">◆</span>';

            }

        }


        /* DÓLAR */

        if(block === "dolar"){

            html +=
            '<span class="dolar">DÓLAR</span> R$ ' +
            money.usd +
            '<span class="sep">◆</span>';

        }


        /* EURO */

        if(block === "euro"){

            html +=
            '<span class="euro">EURO</span> R$ ' +
            money.eur +
            '<span class="sep">◆</span>';

        }


        /* BITCOIN */

        if(block === "bitcoin"){

            html +=
            '<span class="bitcoin">BITCOIN</span> R$ ' +
            money.btc +
            '<span class="sep">◆</span>';

        }


        /* MERCADO */

        if(block === "mercado"){

            let mercado =
            await getRSS(
            "https://g1.globo.com/rss/g1/economia/"
            );

            const item =
            pickOne(mercado);

            if(item){

                html +=
                '<span class="mercado">MERCADO</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* TECH */

        if(block === "tech"){

            let tech =
            await getRSS(
            "https://g1.globo.com/rss/g1/tecnologia/"
            );

            const item =
            pickOne(tech);

            if(item){

                html +=
                '<span class="tech">TECH</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* NEWS */

        if(block === "news"){

            let geral =
            await getRSS(
            "https://g1.globo.com/rss/g1/"
            );

            const item =
            pickOne(geral);

            if(item){

                html +=
                '<span class="news">NEWS</span> ' +
                cleanText(item.title) +
                '<span class="sep">◆</span>';

            }

        }


        /* INSTAGRAM */

        if(block === "instagram"){

            html +=
            '<span class="instagram">INSTAGRAM</span> ' +
            CONFIG.instagram +
            '<span class="sep">◆</span>';

        }

    }

    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* =========================
INICIAR
========================= */

loadContent();


/* =========================
ATUALIZAÇÃO
========================= */

const ticker =
document.getElementById(
"ticker-content"
);

let cycleCount = 0;

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 1){

        cycleCount = 0;

        await loadContent();

    }

});


/* =========================
RELOAD
========================= */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
