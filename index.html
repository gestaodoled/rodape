<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

/* CORES */
.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.news{color:#FFF;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.sep{color:#666;padding:0 14px;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' + configName + '.js?v=' + Date.now() + '"><\/script>'
);

</script>

<script>

/* ================= CONFIG ================= */

document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").style.lineHeight = CONFIG.height + "px";
document.getElementById("left-box").style.fontSize = CONFIG.fontSize + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("clock").style.width = Math.round(CONFIG.width * 0.09) + "px";
document.getElementById("clock").style.height = CONFIG.height + "px";
document.getElementById("clock").style.lineHeight = CONFIG.height + "px";
document.getElementById("clock").style.fontSize = CONFIG.fontSize + "px";

document.getElementById("ticker").style.left = Math.round(CONFIG.width * 0.24) + "px";
document.getElementById("ticker").style.width = Math.round(CONFIG.width * 0.76) + "px";
document.getElementById("ticker").style.height = CONFIG.height + "px";
document.getElementById("ticker").style.lineHeight = CONFIG.height + "px";
document.getElementById("ticker").style.fontSize = CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration = CONFIG.speed + "s";

/* ================= CORE ================= */

let cycleCount = 0;
let lastNews = {};

/* CLOCK */
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerHTML =
    String(now.getHours()).padStart(2,'0') + ":" +
    String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* CLEAN */
function cleanText(text){
    if(!text) return "";
    const t = document.createElement("textarea");
    t.innerHTML = text;
    return t.value.replace(/[\n\r]/g," ").trim();
}

/* ================= RSS DIRETO (PRO) ================= */

async function getRSS(url){

    try{

        const response = await fetch(url);
        const text = await response.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(text,"text/xml");

        const items = xml.querySelectorAll("item");

        let results = [];

        items.forEach(i=>{
            results.push({
                title: i.querySelector("title")?.textContent || ""
            });
        });

        return results;

    }catch{
        return [];
    }
}

/* PICK SEM REPETIR */
function pickOne(arr, key){

    if(!arr || !arr.length) return null;

    let filtered = arr;

    if(lastNews[key]){
        filtered = arr.filter(i => i.title !== lastNews[key]);
    }

    if(!filtered.length) filtered = arr;

    const item = filtered[Math.floor(Math.random()*filtered.length)];

    lastNews[key] = item.title;

    return item;
}

/* WEATHER */
async function getWeather(){
    try{
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=America%2FSao_Paulo`);
        const d = await r.json();

        return {
            temp: Math.round(d.current.temperature_2m),
            max: Math.round(d.daily.temperature_2m_max[0]),
            min: Math.round(d.daily.temperature_2m_min[0]),
            code: d.daily.weathercode[0]
        };

    }catch{
        return {temp:18,max:24,min:17,code:0};
    }
}

/* MONEY */
async function getMoney(){
    try{
        const r = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL");
        const d = await r.json();

        return {
            usd: parseFloat(d.USDBRL.bid).toFixed(2),
            eur: parseFloat(d.EURBRL.bid).toFixed(2),
            btc: Math.round(d.BTCBRL.bid)
        };
    }catch{
        return {usd:"5.40",eur:"6.10",btc:"580000"};
    }
}

/* ================= LOAD ================= */

async function loadContent(){

    let html = "";

    const weather = await getWeather();
    const money = await getMoney();

    for(let block of CONFIG.enabledBlocks){

        if(block === "clima"){
            html += `<span class="clima">CLIMA</span> ${CONFIG.city} ${weather.temp}°C<span class="sep">◆</span>`;
        }

        if(block === "esporte"){
            let r = await getRSS("https://ge.globo.com/rss/ge/futebol/");
            let item = pickOne(r,"esporte");
            html += `<span class="esporte">ESPORTE</span> ${item ? cleanText(item.title) : "Futebol em atualização"}<span class="sep">◆</span>`;
        }

        if(block === "transito"){
            let r = await getRSS(CONFIG.trafficRSS);
            let item = pickOne(r,"transito");
            html += `<span class="transito">TRÂNSITO</span> ${item ? cleanText(item.title) : "SP fluindo normalmente"}<span class="sep">◆</span>`;
        }

        if(block === "news"){
            let r = await getRSS("https://g1.globo.com/rss/g1/");
            let item = pickOne(r,"news");
            if(item) html += `<span class="news">NEWS</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "dolar") html += `<span class="dolar">DÓLAR</span> R$ ${money.usd}<span class="sep">◆</span>`;
        if(block === "euro") html += `<span class="euro">EURO</span> R$ ${money.eur}<span class="sep">◆</span>`;
        if(block === "bitcoin") html += `<span class="bitcoin">BITCOIN</span> R$ ${money.btc}<span class="sep">◆</span>`;

        if(block === "alerta"){
            let msg = weather.code >= 95 ? "Tempestade" :
                      weather.code >= 61 ? "Possibilidade de chuva" :
                      null;

            if(msg) html += `<span class="alerta">ALERTA</span> ${msg}<span class="sep">◆</span>`;
        }
    }

    document.getElementById("ticker-content").innerHTML = html;
}

loadContent();

/* LOOP */
const ticker = document.getElementById("ticker-content");

ticker.addEventListener("animationiteration", async ()=>{
    cycleCount++;
    if(cycleCount >= 2){
        cycleCount = 0;
        await loadContent();
    }
});

</script>

</body>
</html>
