<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=800, height=30">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    animation-duration:170s;
}

/* CORES DAS CATEGORIAS */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

/* =========================
   CONTADOR
========================= */

let cycleCount = 0;


/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   LIMPA TEXTO
========================= */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    let result = txt.value;

    result = result
    .replace(/Â/g,"")
    .replace(/�/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

    return result;

}


/* =========================
   REMOVE DUPLICADAS
========================= */

function removeDuplicates(arr){

    const titles = new Set();

    return arr.filter(item => {

        if(!item.title) return false;

        const title =
        item.title.toLowerCase();

        if(titles.has(title)){

            return false;

        }

        titles.add(title);

        return true;

    });

}


/* =========================
   EMBARALHAR
========================= */

function shuffle(array){

    return array.sort(() =>
    Math.random() - 0.5);

}


/* =========================
   URL SEM CACHE
========================= */

function noCache(url){

    return url +
    (url.includes('?') ? '&' : '?') +
    '_=' +
    new Date().getTime();

}


/* =========================
   RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(
            noCache(rssUrl)
        );

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =========================
   CLIMA
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================
   COTAÇÕES
========================= */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =========================
   FILTRO
========================= */

function safeNews(items){

    const blocked = [

        "morre",
        "morte",
        "crime",
        "assassin",
        "guerra",
        "tragédia"

    ];

    return items.filter(item => {

        if(!item.title) return false;

        const t =
        item.title.toLowerCase();

        return !blocked.some(word =>
        t.includes(word));

    });

}


/* =========================
   PEGA 1 ITEM
========================= */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =========================
   RESULTADOS FUTEBOL
========================= */

const resultados = [

    "Palmeiras 2x1 Santos",
    "Corinthians 1x1 São Paulo",
    "Flamengo 3x0 Vasco",
    "Grêmio 2x2 Internacional",
    "Atlético-MG 1x0 Cruzeiro"

];


/* =========================
   CLASSIFICAÇÃO
========================= */

const classificacao = [

    "Palmeiras líder da Série A",
    "Flamengo segue no G4",
    "Corinthians sobe posições",
    "São Paulo busca vaga Libertadores",
    "Briga intensa no topo da tabela"

];


/* =========================
   CONTEÚDO
========================= */

async function loadContent(){

    let html = "";


    /* CLIMA */

    const weather =
    await getWeather();

    html +=
    '<span class="clima">CLIMA</span> São Paulo ' +
    weather.temp +
    '°C' +
    '<span class="sep">◆</span>';


    /* PREVISÃO */

    html +=
    '<span class="previsao">PREVISÃO</span> Máx ' +
    weather.max +
    '° Mín ' +
    weather.min +
    '°' +
    '<span class="sep">◆</span>';


    /* TRÂNSITO */

    let transito =
    await getRSS(
    "https://g1.globo.com/rss/g1/sao-paulo/"
    );

    transito =
    transito.filter(item => {

        const t =
        item.title.toLowerCase();

        return t.includes("trânsito") ||
               t.includes("transito") ||
               t.includes("acidente") ||
               t.includes("rodovia") ||
               t.includes("marginal") ||
               t.includes("lentidão");

    });

    let transitoItem =
    pickOne(
    safeNews(transito)
    );

    if(transitoItem){

        html +=
        '<span class="transito">TRÂNSITO</span> ' +
        cleanText(transitoItem.title) +
        '<span class="sep">◆</span>';

    }


    /* RODOVIAS */

    html +=
    '<span class="rodovias">RODOVIAS</span> Anchieta-Imigrantes com tráfego moderado' +
    '<span class="sep">◆</span>';


    /* ESPORTE */

    let esporte =
    await getRSS(
    "https://ge.globo.com/rss/ge/futebol/"
    );

    let esporteItem =
    pickOne(
    safeNews(esporte)
    );

    if(esporteItem){

        html +=
        '<span class="esporte">ESPORTE</span> ' +
        cleanText(esporteItem.title) +
        '<span class="sep">◆</span>';

    }


    /* RESULTADOS */

    html +=
    '<span class="resultados">RESULTADOS</span> ' +
    resultados[
    Math.floor(
    Math.random() * resultados.length
    )] +
    '<span class="sep">◆</span>';


    /* SELEÇÃO */

    html +=
    '<span class="selecao">SELEÇÃO</span> Dorival acompanha atletas da Série A' +
    '<span class="sep">◆</span>';


    /* CLASSIFICAÇÃO */

    html +=
    '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
    classificacao[
    Math.floor(
    Math.random() * classificacao.length
    )] +
    '<span class="sep">◆</span>';


    /* COTAÇÕES */

    const money =
    await getMoney();

    html +=
    '<span class="dolar">DÓLAR</span> R$ ' +
    money.usd +
    '<span class="sep">◆</span>';

    html +=
    '<span class="euro">EURO</span> R$ ' +
    money.eur +
    '<span class="sep">◆</span>';

    html +=
    '<span class="bitcoin">BITCOIN</span> R$ ' +
    money.btc +
    '<span class="sep">◆</span>';


    /* MERCADO */

    let economia =
    await getRSS(
    "https://g1.globo.com/rss/g1/economia/"
    );

    let economiaItem =
    pickOne(
    safeNews(economia)
    );

    if(economiaItem){

        html +=
        '<span class="mercado">MERCADO</span> ' +
        cleanText(economiaItem.title) +
        '<span class="sep">◆</span>';

    }


    /* TECH */

    let tech =
    await getRSS(
    "https://g1.globo.com/rss/g1/tecnologia/"
    );

    let techItem =
    pickOne(
    safeNews(tech)
    );

    if(techItem){

        html +=
        '<span class="tech">TECH</span> ' +
        cleanText(techItem.title) +
        '<span class="sep">◆</span>';

    }


    /* TRENDING */

    html +=
    '<span class="trending">TRENDING</span> Inteligência Artificial segue em alta' +
    '<span class="sep">◆</span>';


    /* EVENTOS */

    html +=
    '<span class="eventos">EVENTOS</span> Agenda cultural movimenta São Paulo' +
    '<span class="sep">◆</span>';


    /* AEROPORTOS */

    html +=
    '<span class="aeroportos">AEROPORTOS</span> Congonhas opera normalmente' +
    '<span class="sep">◆</span>';


    /* MEGA-SENA */

    html +=
    '<span class="megasena">MEGA-SENA</span> Prêmio estimado em R$ 42 milhões' +
    '<span class="sep">◆</span>';


    /* SAÚDE */

    html +=
    '<span class="saude">SAÚDE</span> Campanha de vacinação segue em SP' +
    '<span class="sep">◆</span>';


    /* ALERTA */

    html +=
    '<span class="alerta">ALERTA</span> Possibilidade de chuva forte em São Paulo' +
    '<span class="sep">◆</span>';


    /* ENTRETENIMENTO */

    let entretenimento =
    await getRSS(
    "https://g1.globo.com/rss/g1/pop-arte/"
    );

    let entretenimentoItem =
    pickOne(
    safeNews(entretenimento)
    );

    if(entretenimentoItem){

        html +=
        '<span class="entretenimento">ENTRETENIMENTO</span> ' +
        cleanText(entretenimentoItem.title) +
        '<span class="sep">◆</span>';

    }


    /* NEWS */

    let geral =
    await getRSS(
    "https://g1.globo.com/rss/g1/"
    );

    let geralItem =
    pickOne(
    safeNews(geral)
    );

    if(geralItem){

        html +=
        '<span class="news">NEWS</span> ' +
        cleanText(geralItem.title) +
        '<span class="sep">◆</span>';

    }


    /* MOTIVAÇÃO */

    const frases = [

        "Grandes resultados exigem constância",
        "Persistência gera resultados",
        "Disciplina vence talento",
        "Foco no objetivo"

    ];

    html +=
    '<span class="motivacao">MOTIVAÇÃO</span> ' +
    frases[
    Math.floor(
    Math.random() * frases.length
    )] +
    '<span class="sep">◆</span>';


    /* LUMIX */

    const lumix = [

        "Impacto visual que vende",
        "Especialistas em painéis de LED",
        "Tecnologia visual de alto impacto"

    ];

    html +=
    '<span class="lumix">LUMIX LED</span> ' +
    lumix[
    Math.floor(
    Math.random() * lumix.length
    )] +
    '<span class="sep">◆</span>';


    /* INSTAGRAM */

    html +=
    '<span class="instagram">INSTAGRAM</span> @lumix.led' +
    '<span class="sep">◆</span>';


    /* RENDER */

    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* =========================
   INICIAR
========================= */

loadContent();


/* =========================
   ATUALIZA APÓS 2 CICLOS
========================= */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});

</script>

</body>
</html>
