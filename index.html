<script>

/* =========================
CLIMA MELHORADO
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            feels:
            Math.round(data.current.apparent_temperature),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:20,
            feels:20,
            max:25,
            min:18

        };

    }

}


/* =========================
LIGAS
========================= */

const leagues = [

    {
        id:4328,
        name:"Premier League"
    },

    {
        id:4335,
        name:"La Liga"
    },

    {
        id:4331,
        name:"Bundesliga"
    },

    {
        id:4332,
        name:"Serie A"
    },

    {
        id:4340,
        name:"Brasileirão"
    }

];


/* =========================
LIGA ALEATÓRIA
========================= */

function getRandomLeague(){

    return leagues[
    Math.floor(
    Math.random() * leagues.length
    )];

}


/* =========================
RESULTADOS REAIS
========================= */

async function getResults(){

    try{

        const league =
        getRandomLeague();

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=${league.id}`
        );

        const data =
        await response.json();

        if(!data.events) return null;

        const validGames =
        data.events.filter(game =>

            game.intHomeScore !== null &&
            game.intAwayScore !== null

        );

        if(validGames.length === 0)
        return null;

        const game =
        validGames[
        Math.floor(
        Math.random() *
        Math.min(validGames.length,15)
        )];

        return {

            league:
            league.name,

            text:
            game.strHomeTeam +
            ' ' +
            game.intHomeScore +
            'x' +
            game.intAwayScore +
            ' ' +
            game.strAwayTeam

        };

    }catch(error){

        return null;

    }

}


/* =========================
PRÓXIMOS JOGOS
========================= */

async function getNextGames(){

    try{

        const league =
        getRandomLeague();

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${league.id}`
        );

        const data =
        await response.json();

        if(!data.events)
        return null;

        const game =
        data.events[
        Math.floor(
        Math.random() *
        Math.min(data.events.length,10)
        )];

        const time =
        game.strTime
        ? game.strTime.substring(0,5)
        : "--:--";

        return {

            league:
            league.name,

            text:
            game.strHomeTeam +
            ' x ' +
            game.strAwayTeam +
            ' ' +
            time

        };

    }catch(error){

        return null;

    }

}


/* =========================
CLASSIFICAÇÃO TOP 4
========================= */

async function getStandings(){

    try{

        const league =
        getRandomLeague();

        const season =
        "2025-2026";

        const response =
        await fetch(
        `https://www.thesportsdb.com/api/v1/json/3/lookuptable.php?l=${league.id}&s=${season}`
        );

        const data =
        await response.json();

        if(!data.table)
        return null;

        const top4 =
        data.table.slice(0,4);

        let text = "";

        top4.forEach((team,index) => {

            const teamName =
            team.name ||
            team.strTeam ||
            "Time";

            const points =
            team.intPoints || 0;

            text +=
            `${index+1}° ${teamName} ${points} pts`;

            if(index < 3){

                text += ' • ';

            }

        });

        return {

            league:
            league.name,

            text:text

        };

    }catch(error){

        return null;

    }

}

</script>
