<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>20 LUMIX NEWS PRO STABLE</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#fff;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #fff;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#fff;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.news{color:#fff;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.politica{color:#FF4444;font-weight:bold;}
.mundo{color:#4FC3F7;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.agro{color:#8BC34A;font-weight:bold;}
.ciencia{color:#00E5FF;font-weight:bold;}
.games{color:#AA66CC;font-weight:bold;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando...</div>
</div>

<script>

/* =========================
   CONFIG LOADER SEGURO
========================= */

let CONFIG = {};

async function loadConfig(){

    const params =
    new URLSearchParams(window.location.search);

    const configName =
    params.get("config") || "default";

    return new Promise((resolve)=>{

        const script =
        document.createElement("script");

        script.src =
        "configs/" + configName + ".js?v=" + Date.now();

        script.onload = () => {

            CONFIG = window.CONFIG || {};

            resolve();

        };

        script.onerror = () => {

            CONFIG = {
                width:800,
                height:30,
                speed:70,
                city:"São Paulo",
                title:"LUMIX"
            };

            resolve();

        };

        document.head.appendChild(script);

    });

}


/* =========================
   LAYOUT
========================= */

function applyLayout(){

    document.body.style.width = CONFIG.width + "px";
    document.body.style.height = CONFIG.height + "px";

    const left = document.getElementById("left-box");
    const clock = document.getElementById("clock");
    const ticker = document.getElementById("ticker");
    const content = document.getElementById("ticker-content");

    left.style.width = Math.round(CONFIG.width * 0.15) + "px";
    left.style.height = CONFIG.height + "px";
    left.style.lineHeight = CONFIG.height + "px";
    left.innerHTML = CONFIG.title || "LUMIX";

    clock.style.left = Math.round(CONFIG.width * 0.15 + 1) + "px";
    clock.style.width = Math.round(CONFIG.width * 0.09) + "px";
    clock.style.height = CONFIG.height + "px";
    clock.style.lineHeight = CONFIG.height + "px";

    ticker.style.left = Math.round(CONFIG.width * 0.24) + "px";
    ticker.style.width = Math.round(CONFIG.width * 0.76) + "px";
    ticker.style.height = CONFIG.height + "px";
    ticker.style.lineHeight = CONFIG.height + "px";

    content.style.animationDuration = (CONFIG.speed || 70) + "s";

}


/* =========================
   CLOCK
========================= */

setInterval(()=>{
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0');
},1000);


/* =========================
   SAFE TEXT
========================= */

function safe(t){
    return (t || "").replace(/[\n\r]/g," ").slice(0,120);
}


/* =========================
   CACHE SIMPLES
========================= */

let CACHE = {
    news:[],
    esporte:[],
    politica:[]
};


/* =========================
   GNEWS
========================= */

async function getGNews(query){

    try{

        const r =
        await fetch(
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&max=5&apikey=9c1aaf5a12ad6ffe75f77c7fe15ad790"
        );

        const d = await r.json();

        return (d.articles || []).map(a=>a.title);

    }catch(e){
        return [];
    }

}


/* =========================
   UPDATE CACHE
========================= */

async function updateCache(){

    const n = await getGNews("brasil economia");
    if(n.length) CACHE.news = n;

    const s = await getGNews("futebol");
    if(s.length) CACHE.esporte = s;

    const p = await getGNews("politica");
    if(p.length) CACHE.politica = p;

}


/* =========================
   RENDER
========================= */

function pick(arr){
    if(!arr || !arr.length) return "";
    return arr[Math.floor(Math.random()*arr.length)];
}


/* =========================
   RENDER SAFE
========================= */

function render(){

    const ticker = document.getElementById("ticker-content");

    ticker.innerHTML =

    `<span class="clima">CLIMA</span> ${CONFIG.city || ""} 28°C <span class="sep">◆</span>` +

    `<span class="news">NEWS</span> ${safe(pick(CACHE.news))} <span class="sep">◆</span>` +

    `<span class="esporte">ESPORTE</span> ${safe(pick(CACHE.esporte))} <span class="sep">◆</span>` +

    `<span class="politica">POLÍTICA</span> ${safe(pick(CACHE.politica))} <span class="sep">◆</span>`;

}


/* =========================
   LOOP
========================= */

async function loop(){
    await updateCache();
    render();
}


/* =========================
   START SEGURO
========================= */

(async ()=>{

    await loadConfig();
    applyLayout();

    await loop();

    setInterval(loop, 60000);

})();

</script>

</body>
</html>
