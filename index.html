<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#fff;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #fff;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #fff;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#fff;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' + configName + '.js?v=' + Date.now() + '"><\/script>'
);

let cycle = 0;

/* CLOCK */
function clock(){
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0');
}
setInterval(clock,1000);
clock();

/* RSS */
async function getRSS(url){
    try{
        const r = await fetch(
        "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url)
        );
        const d = await r.json();
        return d.items || [];
    }catch{
        return [];
    }
}

/* PICK SAFE */
function pick(list){
    if(!list || !list.length) return null;
    return list[Math.floor(Math.random()*list.length)];
}

/* ESPORTE ROBUSTO */
async function esporte(){

    const feeds = await Promise.allSettled([
        getRSS("https://ge.globo.com/rss/ge/futebol/"),
        getRSS("https://rss.uol.com.br/feed/esporte.xml"),
        getRSS("https://feeds.bbci.co.uk/sport/football/rss.xml")
    ]);

    let all = [];

    feeds.forEach(f=>{
        if(f.status === "fulfilled"){
            all = all.concat(f.value);
        }
    });

    let item = pick(all);

    return item
    ? item.title
    : "Futebol em atualização";
}

/* TRÂNSITO SP ROBUSTO */
async function transito(){

    const feeds = await Promise.allSettled([
        getRSS(CONFIG.trafficRSS),
        getRSS("https://g1.globo.com/rss/g1/sao-paulo/"),
        getRSS("https://rss.uol.com.br/feed/noticias.xml")
    ]);

    let all = [];

    feeds.forEach(f=>{
        if(f.status === "fulfilled"){
            all = all.concat(f.value);
        }
    });

    let filtered = all.filter(i =>
        /trânsito|acidente|lentidão|marginal|sp|rodovia/i.test(i.title)
    );

    let item = pick(filtered.length ? filtered : all);

    return item
    ? item.title
    : "SP sem ocorrências relevantes";
}

/* MONTAGEM */
async function load(){

    let html = "";

    const [esp, tra] = await Promise.all([
        esporte(),
        transito()
    ]);

    const money = {
        usd:"5.20",
        eur:"6.10",
        btc:"590000"
    };

    const blocks = CONFIG.enabledBlocks || [];

    for(let b of blocks){

        if(b === "esporte"){
            html += `<span class="esporte">ESPORTE</span> ${esp}<span class="sep">◆</span>`;
        }

        if(b === "transito"){
            html += `<span class="transito">TRÂNSITO SP</span> ${tra}<span class="sep">◆</span>`;
        }

        if(b === "dolar"){
            html += `<span class="dolar">DÓLAR</span> R$ ${money.usd}<span class="sep">◆</span>`;
        }

        if(b === "euro"){
            html += `<span class="euro">EURO</span> R$ ${money.eur}<span class="sep">◆</span>`;
        }

        if(b === "bitcoin"){
            html += `<span class="bitcoin">BITCOIN</span> R$ ${money.btc}<span class="sep">◆</span>`;
        }

        if(b === "motivacao"){
            const f = [
                "Disciplina gera resultado",
                "Consistência vence talento",
                "Foco cria destino"
            ];
            html += `<span class="motivacao">FOCO</span> ${pick(f)}<span class="sep">◆</span>`;
        }
    }

    /* 🔥 GARANTIA FINAL (NUNCA FICA VAZIO) */
    if(!html.trim()){
        html =
        `<span class="lumix">LUMIX</span> Sistema ativo<span class="sep">◆</span>` +
        `<span class="esporte">ESPORTE</span> Atualizando notícias<span class="sep">◆</span>`;
    }

    document.getElementById("ticker-content").innerHTML = html;
}

load();

/* refresh seguro */
setInterval(()=>{
    cycle++;
    if(cycle >= 2){
        cycle = 0;
        load();
    }
}, 7000);

</script>

</body>
</html>
