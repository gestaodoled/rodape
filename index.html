<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=800, height=30">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    animation-duration:140s;
}

/* ESTILOS */

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

/* =========================
   CONTADOR DE CICLOS
========================= */

let cycleCount = 0;


/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   REMOVE DUPLICADAS
========================= */

function removeDuplicates(arr){

    const titles = new Set();

    return arr.filter(item => {

        if(!item.title) return false;

        const title =
        item.title.toLowerCase();

        if(titles.has(title)){

            return false;

        }

        titles.add(title);

        return true;

    });

}


/* =========================
   EMBARALHAR
========================= */

function shuffle(array){

    return array.sort(() =>
    Math.random() - 0.5);

}


/* =========================
   URL SEM CACHE
========================= */

function noCache(url){

    return url +
    (url.includes('?') ? '&' : '?') +
    '_=' +
    new Date().getTime();

}


/* =========================
   RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(
            noCache(rssUrl)
        );

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        console.log("Erro RSS:",rssUrl);

        return [];

    }

}


/* =========================
   CLIMA ONLINE
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(
            data.current.temperature_2m
            ),

            max:
            Math.round(
            data.daily.temperature_2m_max[0]
            ),

            min:
            Math.round(
            data.daily.temperature_2m_min[0]
            )

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================
   DÓLAR ONLINE
========================= */

async function getDollar(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL"
        );

        const data =
        await response.json();

        return parseFloat(
        data.USDBRL.bid
        ).toFixed(2);

    }catch(error){

        return "5.42";

    }

}


/* =========================
   FILTRO DE PALAVRAS
========================= */

function safeNews(items){

    const blocked = [

        "morre",
        "morte",
        "tragédia",
        "tragico",
        "assassin",
        "crime",
        "guerra"

    ];

    return items.filter(item => {

        if(!item.title) return false;

        const t =
        item.title.toLowerCase();

        return !blocked.some(word =>
        t.includes(word));

    });

}


/* =========================
   AJUSTA VELOCIDADE
========================= */

function updateSpeed(textLength){

    let seconds = 100;

    if(textLength > 6000){

        seconds = 180;

    }else if(textLength > 4000){

        seconds = 150;

    }else if(textLength > 2500){

        seconds = 130;

    }

    document.getElementById(
    "ticker-content"
    ).style.animationDuration =
    seconds + "s";

}


/* =========================
   CARREGAR CONTEÚDO
========================= */

async function loadContent(){

    console.log("Atualizando conteúdo...");

    let html = "";


    /* CLIMA */

    const weather =
    await getWeather();

    html +=
    '<span class="label">CLIMA</span> São Paulo ' +
    weather.temp +
    '°C' +
    '<span class="sep">◆</span>';



    /* PREVISÃO */

    html +=
    '<span class="label">PREVISÃO</span> Máx ' +
    weather.max +
    '° Mín ' +
    weather.min +
    '°' +
    '<span class="sep">◆</span>';


    /* ESPORTES */

    let esportes = [

        ...(await getRSS(
        "https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/"
        )).slice(0,3),

        ...(await getRSS(
        "https://rss.uol.com.br/feed/esporte.xml"
        )).slice(0,3)

    ];

    esportes =
    safeNews(
    removeDuplicates(
    shuffle(esportes)
    ));

    esportes.slice(0,4).forEach(item => {

        html +=
        '<span class="label">ESPORTE</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* ECONOMIA */

    let economia = [

        ...(await getRSS(
        "https://g1.globo.com/rss/g1/economia/"
        )).slice(0,3),

        ...(await getRSS(
        "https://rss.uol.com.br/feed/economia.xml"
        )).slice(0,3)

    ];

    economia =
    safeNews(
    removeDuplicates(
    shuffle(economia)
    ));

    economia.slice(0,3).forEach(item => {

        html +=
        '<span class="label">MERCADO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* DÓLAR */

    const dollar =
    await getDollar();

    html +=
    '<span class="label">DÓLAR</span> R$ ' +
    dollar +
    '<span class="sep">◆</span>';


    /* TECH */

    let tech = [

        ...(await getRSS(
        "https://g1.globo.com/rss/g1/tecnologia/"
        )).slice(0,3),

        ...(await getRSS(
        "https://feeds.feedburner.com/tecnoblog"
        )).slice(0,3)

    ];

    tech =
    safeNews(
    removeDuplicates(
    shuffle(tech)
    ));

    tech.slice(0,3).forEach(item => {

        html +=
        '<span class="label">TECH</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* TRÂNSITO */

    let transito =
    await getRSS(
    "https://g1.globo.com/rss/g1/sao-paulo/"
    );

    transito =
    transito.filter(item => {

        const t =
        item.title.toLowerCase();

        return t.includes("trânsito") ||
               t.includes("acidente") ||
               t.includes("rodovia") ||
               t.includes("marginal") ||
               t.includes("lentidão");

    });

    transito =
    safeNews(
    removeDuplicates(
    shuffle(transito)
    ));

    transito.slice(0,3).forEach(item => {

        html +=
        '<span class="label">TRÂNSITO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* ENTRETENIMENTO */

    let entretenimento = [

        ...(await getRSS(
        "https://g1.globo.com/rss/g1/pop-arte/"
        )).slice(0,3),

        ...(await getRSS(
        "https://rss.uol.com.br/feed/splash.xml"
        )).slice(0,3)

    ];

    entretenimento =
    safeNews(
    removeDuplicates(
    shuffle(entretenimento)
    ));

    entretenimento.slice(0,3).forEach(item => {

        html +=
        '<span class="label">ENTRETENIMENTO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* NEWS */

    let geral = [

        ...(await getRSS(
        "https://g1.globo.com/rss/g1/"
        )).slice(0,3),

        ...(await getRSS(
        "https://www.cnnbrasil.com.br/feed/"
        )).slice(0,3),

        ...(await getRSS(
        "https://rss.uol.com.br/feed/noticias.xml"
        )).slice(0,3)

    ];

    geral =
    safeNews(
    removeDuplicates(
    shuffle(geral)
    ));

    geral.slice(0,4).forEach(item => {

        html +=
        '<span class="label">NEWS</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* INSTAGRAM */

    html +=
    '<span class="label">INSTAGRAM</span> @lumix.led' +
    '<span class="sep">◆</span>';


    /* ATUALIZA HTML */

    document.getElementById(
    "ticker-content"
    ).innerHTML = html;


    /* AJUSTA VELOCIDADE */

    updateSpeed(html.length);

}


/* =========================
   INICIAR
========================= */

loadContent();


/* =========================
   ATUALIZA APÓS 2 CICLOS
========================= */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    console.log(
    "Ciclo:",
    cycleCount
    );

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});

</script>

</body>
</html>
