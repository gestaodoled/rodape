<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>LUMIX NEWS PRO MAX</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* LAYOUT */
#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

/* CORES */
.esporte{color:#00FF00;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.economia{color:#FFD700;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.clima{color:#00FFFF;font-weight:bold;}
.sep{color:#666;padding:0 14px;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' + configName + '.js?v=' + Date.now() + '"><\/script>'
);

</script>

<script>

/* ================= CONFIG ================= */

document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left = Math.round(CONFIG.width * 0.15) + "px";
document.getElementById("clock").style.width = Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("ticker").style.left = Math.round(CONFIG.width * 0.24) + "px";
document.getElementById("ticker").style.width = Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker-content").style.animationDuration = CONFIG.speed + "s";

/* ================= CLOCK ================= */

function updateClock(){
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* ================= RSS CORE ================= */

async function getRSS(url){
    try{
        const r = await fetch(url);
        const t = await r.text();
        const xml = new DOMParser().parseFromString(t,"text/xml");

        let items = xml.querySelectorAll("item");

        let out = [];

        items.forEach(i=>{
            out.push({
                title: i.querySelector("title")?.textContent || ""
            });
        });

        return out;

    }catch{
        return [];
    }
}

/* ================= 1. BANCO GLOBAL ================= */

let NEWS_POOL = [];

/* ================= 2. MULTI-FONTE ================= */

async function fetchAllNews(){

    let pool = [];

    async function add(url, tag){

        let data = await getRSS(url);

        data.forEach(i=>{
            pool.push({
                title: i.title,
                tag: tag
            });
        });

    }

    /* ESPORTE */
    await add("https://ge.globo.com/rss/ge/futebol/", "esporte");
    await add("https://rss.uol.com.br/feed/esporte.xml", "esporte");

    /* NEWS */
    await add("https://g1.globo.com/rss/g1/", "news");
    await add("https://feeds.folha.uol.com.br/emcimadahora/rss091.xml", "news");

    /* ECONOMIA */
    await add("https://g1.globo.com/rss/g1/economia/", "economia");

    return pool;
}

/* ================= 3. TICKER BUILDER ================= */

function buildTicker(pool){

    let html = "";

    pool.forEach(item=>{
        html += `<span class="${item.tag}">${item.tag.toUpperCase()}</span> ${item.title}<span class="sep">◆</span>`;
    });

    return html;
}

/* ================= 4. LOAD FINAL ================= */

async function loadContent(){

    let pool = await fetchAllNews();

    /* embaralha para fluxo dinâmico */
    pool = pool.sort(()=>Math.random()-0.5);

    let html = buildTicker(pool);

    document.getElementById("ticker-content").innerHTML = html;
}

/* START */
loadContent();

/* REFRESH CONTÍNUO */
setInterval(loadContent, 60000);

</script>

</body>
</html>
