<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<!-- =========================================
     CONFIG DINÂMICO
========================================= -->

<script>

const params =
new URLSearchParams(
window.location.search
);

const configName =
params.get("config") || "painel1";

document.write(
'<script src="configs/' +
configName +
'.js"><\/script>'
);

</script>

<script>

/* =========================================
   CONFIGURAÇÃO VISUAL
========================================= */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";


/* LEFT BOX */

const leftBox =
document.getElementById("left-box");

leftBox.style.width = "120px";
leftBox.style.height =
CONFIG.height + "px";

leftBox.style.lineHeight =
CONFIG.height + "px";

leftBox.style.fontSize =
CONFIG.fontSize + "px";

leftBox.innerHTML =
CONFIG.title;


/* CLOCK */

const clock =
document.getElementById("clock");

clock.style.left = "121px";

clock.style.width = "70px";

clock.style.height =
CONFIG.height + "px";

clock.style.lineHeight =
CONFIG.height + "px";

clock.style.fontSize =
CONFIG.fontSize + "px";


/* TICKER */

const ticker =
document.getElementById("ticker");

ticker.style.left = "192px";

ticker.style.width =
(CONFIG.width - 192) + "px";

ticker.style.height =
CONFIG.height + "px";

ticker.style.lineHeight =
CONFIG.height + "px";

ticker.style.fontSize =
CONFIG.fontSize + "px";


/* ANIMAÇÃO */

const tickerContent =
document.getElementById("ticker-content");

tickerContent.style.animationDuration =
CONFIG.speed + "s";


/* =========================================
   CONTADOR
========================================= */

let cycleCount = 0;


/* =========================================
   RELÓGIO
========================================= */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    clock.innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================================
   LIMPA TEXTO
========================================= */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

}


/* =========================================
   REMOVE DUPLICADAS
========================================= */

function removeDuplicates(arr){

    const titles = new Set();

    return arr.filter(item => {

        if(!item.title) return false;

        const title =
        item.title.toLowerCase();

        if(titles.has(title)){

            return false;

        }

        titles.add(title);

        return true;

    });

}


/* =========================================
   URL SEM CACHE
========================================= */

function noCache(url){

    return url +
    (url.includes('?') ? '&' : '?') +
    '_=' +
    new Date().getTime();

}


/* =========================================
   RSS
========================================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(
        noCache(rssUrl)
        );

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =========================================
   CLIMA
========================================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================================
   COTAÇÕES
========================================= */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =========================================
   FILTRO
========================================= */

function safeNews(items){

    const blocked = [

        "morre",
        "morte",
        "crime",
        "assassin",
        "guerra",
        "tragédia"

    ];

    return items.filter(item => {

        if(!item.title) return false;

        const t =
        item.title.toLowerCase();

        return !blocked.some(word =>
        t.includes(word));

    });

}


/* =========================================
   PEGA ITEM
========================================= */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =========================================
   CONTEÚDO
========================================= */

async function loadContent(){

    let html = "";


    /* CLIMA */

    if(CONFIG.enabledBlocks.includes("clima")){

        const weather =
        await getWeather();

        html +=
        '<span class="clima">CLIMA</span> ' +
        CONFIG.city +
        ' ' +
        weather.temp +
        '°C' +
        '<span class="sep">◆</span>';

    }


    /* PREVISÃO */

    if(CONFIG.enabledBlocks.includes("previsao")){

        const weather =
        await getWeather();

        html +=
        '<span class="previsao">PREVISÃO</span> Máx ' +
        weather.max +
        '° Mín ' +
        weather.min +
        '°' +
        '<span class="sep">◆</span>';

    }


    /* TRÂNSITO */

    if(CONFIG.enabledBlocks.includes("transito")){

        let transito =
        await getRSS(
        "https://g1.globo.com/rss/g1/sao-paulo/"
        );

        transito =
        transito.filter(item => {

            const t =
            item.title.toLowerCase();

            return t.includes("trânsito") ||
                   t.includes("transito") ||
                   t.includes("acidente") ||
                   t.includes("marginal") ||
                   t.includes("rodovia");

        });

        const item =
        pickOne(
        safeNews(transito)
        );

        if(item){

            html +=
            '<span class="transito">TRÂNSITO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* RODOVIAS */

    if(CONFIG.enabledBlocks.includes("rodovias")){

        html +=
        '<span class="rodovias">RODOVIAS</span> ' +
        CONFIG.textosFixos.rodovias +
        '<span class="sep">◆</span>';

    }


    /* ESPORTE */

    if(CONFIG.enabledBlocks.includes("esporte")){

        let esporte =
        await getRSS(
        "https://ge.globo.com/rss/ge/futebol/"
        );

        const item =
        pickOne(
        safeNews(esporte)
        );

        if(item){

            html +=
            '<span class="esporte">ESPORTE</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* RESULTADOS */

    if(CONFIG.enabledBlocks.includes("resultados")){

        html +=
        '<span class="resultados">RESULTADOS</span> ' +
        CONFIG.resultados[
        Math.floor(
        Math.random() *
        CONFIG.resultados.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* SELEÇÃO */

    if(CONFIG.enabledBlocks.includes("selecao")){

        html +=
        '<span class="selecao">SELEÇÃO</span> ' +
        CONFIG.textosFixos.selecao +
        '<span class="sep">◆</span>';

    }


    /* CLASSIFICAÇÃO */

    if(CONFIG.enabledBlocks.includes("classificacao")){

        html +=
        '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
        CONFIG.classificacao[
        Math.floor(
        Math.random() *
        CONFIG.classificacao.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* COTAÇÕES */

    const money =
    await getMoney();

    if(CONFIG.enabledBlocks.includes("dolar")){

        html +=
        '<span class="dolar">DÓLAR</span> R$ ' +
        money.usd +
        '<span class="sep">◆</span>';

    }

    if(CONFIG.enabledBlocks.includes("euro")){

        html +=
        '<span class="euro">EURO</span> R$ ' +
        money.eur +
        '<span class="sep">◆</span>';

    }

    if(CONFIG.enabledBlocks.includes("bitcoin")){

        html +=
        '<span class="bitcoin">BITCOIN</span> R$ ' +
        money.btc +
        '<span class="sep">◆</span>';

    }


    /* MERCADO */

    if(CONFIG.enabledBlocks.includes("mercado")){

        let economia =
        await getRSS(
        "https://g1.globo.com/rss/g1/economia/"
        );

        const item =
        pickOne(
        safeNews(economia)
        );

        if(item){

            html +=
            '<span class="mercado">MERCADO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* TECH */

    if(CONFIG.enabledBlocks.includes("tech")){

        let tech =
        await getRSS(
        "https://g1.globo.com/rss/g1/tecnologia/"
        );

        const item =
        pickOne(
        safeNews(tech)
        );

        if(item){

            html +=
            '<span class="tech">TECH</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* TRENDING */

    if(CONFIG.enabledBlocks.includes("trending")){

        html +=
        '<span class="trending">TRENDING</span> ' +
        CONFIG.textosFixos.trending +
        '<span class="sep">◆</span>';

    }


    /* EVENTOS */

    if(CONFIG.enabledBlocks.includes("eventos")){

        html +=
        '<span class="eventos">EVENTOS</span> ' +
        CONFIG.textosFixos.eventos +
        '<span class="sep">◆</span>';

    }


    /* AEROPORTOS */

    if(CONFIG.enabledBlocks.includes("aeroportos")){

        html +=
        '<span class="aeroportos">AEROPORTOS</span> ' +
        CONFIG.textosFixos.aeroportos +
        '<span class="sep">◆</span>';

    }


    /* MEGA-SENA */

    if(CONFIG.enabledBlocks.includes("megasena")){

        html +=
        '<span class="megasena">MEGA-SENA</span> ' +
        CONFIG.textosFixos.megasena +
        '<span class="sep">◆</span>';

    }


    /* SAÚDE */

    if(CONFIG.enabledBlocks.includes("saude")){

        html +=
        '<span class="saude">SAÚDE</span> ' +
        CONFIG.textosFixos.saude +
        '<span class="sep">◆</span>';

    }


    /* ALERTA */

    if(CONFIG.enabledBlocks.includes("alerta")){

        html +=
        '<span class="alerta">ALERTA</span> ' +
        CONFIG.textosFixos.alerta +
        '<span class="sep">◆</span>';

    }


    /* ENTRETENIMENTO */

    if(CONFIG.enabledBlocks.includes("entretenimento")){

        let entretenimento =
        await getRSS(
        "https://g1.globo.com/rss/g1/pop-arte/"
        );

        const item =
        pickOne(
        safeNews(entretenimento)
        );

        if(item){

            html +=
            '<span class="entretenimento">ENTRETENIMENTO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* NEWS */

    if(CONFIG.enabledBlocks.includes("news")){

        let geral =
        await getRSS(
        "https://rss.uol.com.br/feed/noticias.xml"
        );

        const item =
        pickOne(
        safeNews(geral)
        );

        if(item){

            html +=
            '<span class="news">NEWS</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* MOTIVAÇÃO */

    if(CONFIG.enabledBlocks.includes("motivacao")){

        html +=
        '<span class="motivacao">MOTIVAÇÃO</span> ' +
        CONFIG.frases[
        Math.floor(
        Math.random() *
        CONFIG.frases.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* LUMIX */

    if(CONFIG.enabledBlocks.includes("lumix")){

        html +=
        '<span class="lumix">LUMIX LED</span> ' +
        CONFIG.lumix[
        Math.floor(
        Math.random() *
        CONFIG.lumix.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* INSTAGRAM */

    if(CONFIG.enabledBlocks.includes("instagram")){

        html +=
        '<span class="instagram">INSTAGRAM</span> ' +
        CONFIG.instagram +
        '<span class="sep">◆</span>';

    }


    tickerContent.innerHTML = html;

}


/* =========================================
   INICIAR
========================================= */

loadContent();


/* =========================================
   ATUALIZA APÓS 2 CICLOS
========================================= */

tickerContent.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});

</script>

</body>
</html>
