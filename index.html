<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* BARRA ESQUERDA */
#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */
#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    z-index:5;
}

/* TICKER */
#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.news{color:#FFF;font-weight:bold;}
.politica{color:#FF4444;font-weight:bold;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

/* =========================
   CONFIG SEGURO
========================= */

let CONFIG = null;

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

const script = document.createElement("script");

script.src = "configs/" + configName + ".js?v=" + Date.now();

script.onload = init;

script.onerror = function(){

    CONFIG = {
        width:800,
        height:30,
        speed:70,
        city:"São Paulo",
        title:"LUMIX NEWS"
    };

    init();

};

document.head.appendChild(script);


/* =========================
   INIT
========================= */

function init(){

    CONFIG = window.CONFIG || CONFIG;

    if(!CONFIG){
        CONFIG = {
            width:800,
            height:30,
            speed:70,
            city:"São Paulo",
            title:"LUMIX NEWS"
        };
    }

    CONFIG.title = CONFIG.title || "LUMIX NEWS";

    applyLayout();
    startClock();
    startSystem();

}


/* =========================
   LAYOUT CORRIGIDO (SEM OVERLAP)
========================= */

function applyLayout(){

    document.body.style.width = CONFIG.width + "px";
    document.body.style.height = CONFIG.height + "px";

    const left = document.getElementById("left-box");
    const clock = document.getElementById("clock");
    const ticker = document.getElementById("ticker");

    const leftW = Math.round(CONFIG.width * 0.18);
    const clockW = Math.round(CONFIG.width * 0.10);
    const tickerW = CONFIG.width - (leftW + clockW);

    left.style.width = leftW + "px";
    left.style.height = CONFIG.height + "px";
    left.style.lineHeight = CONFIG.height + "px";
    left.innerHTML = CONFIG.title;

    clock.style.left = leftW + "px";
    clock.style.width = clockW + "px";
    clock.style.height = CONFIG.height + "px";
    clock.style.lineHeight = CONFIG.height + "px";

    ticker.style.left = (leftW + clockW) + "px";
    ticker.style.width = tickerW + "px";
    ticker.style.height = CONFIG.height + "px";
    ticker.style.lineHeight = CONFIG.height + "px";

}


/* =========================
   CLOCK
========================= */

function startClock(){

    setInterval(()=>{

        const d = new Date();

        document.getElementById("clock").innerHTML =
        String(d.getHours()).padStart(2,'0') + ":" +
        String(d.getMinutes()).padStart(2,'0');

    },1000);

}


/* =========================
   SAFE TEXT
========================= */

function safe(t){
    return (t || "")
    .replace(/[\n\r]/g," ")
    .slice(0,120);
}


/* =========================
   CACHE SIMPLES
========================= */

let CACHE = {
    news:[],
    esporte:[],
    politica:[]
};


/* =========================
   API
========================= */

async function getGNews(query){

    try{

        const r = await fetch(
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&max=5&apikey=9c1aaf5a12ad6ffe75f77c7fe15ad790"
        );

        const d = await r.json();

        return (d.articles || []).map(a=>a.title);

    }catch(e){
        return [];
    }

}


/* =========================
   LOAD SYSTEM
========================= */

function startSystem(){

    update();
    render();

    setInterval(()=>{
        update();
        render();
    },60000);

}


/* =========================
   UPDATE CACHE
========================= */

async function update(){

    const n = await getGNews("brasil economia");
    if(n.length) CACHE.news = n;

    const s = await getGNews("futebol");
    if(s.length) CACHE.esporte = s;

    const p = await getGNews("politica");
    if(p.length) CACHE.politica = p;

}


/* =========================
   PICK SAFE
========================= */

function pick(arr){
    if(!arr || !arr.length) return "";
    return arr[Math.floor(Math.random()*arr.length)];
}


/* =========================
   RENDER
========================= */

function render(){

    const el = document.getElementById("ticker-content");

    el.innerHTML =

    `<span class="clima">CLIMA</span> ${CONFIG.city} 28°C <span class="sep">◆</span>` +

    `<span class="news">NEWS</span> ${safe(pick(CACHE.news))} <span class="sep">◆</span>` +

    `<span class="esporte">ESPORTE</span> ${safe(pick(CACHE.esporte))} <span class="sep">◆</span>` +

    `<span class="politica">POLÍTICA</span> ${safe(pick(CACHE.politica))} <span class="sep">◆</span>`;

}

</script>

</body>
</html>
