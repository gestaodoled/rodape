<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>21 LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* LAYOUT ORIGINAL */
#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

/* =========================
   CONFIG EXTERNO (SEGURO)
========================= */

let CONFIG = {};

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

const script =
document.createElement("script");

script.src =
"configs/" + configName + ".js?v=" + Date.now();

script.onload = init;

script.onerror = function(){

    CONFIG = {
        width:800,
        height:30,
        speed:70,
        city:"São Paulo",
        title:"LUMIX"
    };

    init();

};

document.head.appendChild(script);


/* =========================
   INIT
========================= */

function init(){

    CONFIG = window.CONFIG || CONFIG;

    applyLayout();
    startClock();
    loadAll();
}


/* =========================
   LAYOUT (NÃO ALTERA ESCALA)
========================= */

function applyLayout(){

    document.body.style.width = CONFIG.width + "px";
    document.body.style.height = CONFIG.height + "px";

    const left = document.getElementById("left-box");
    const clock = document.getElementById("clock");
    const ticker = document.getElementById("ticker");

    left.style.width = Math.round(CONFIG.width * 0.15) + "px";
    left.style.height = CONFIG.height + "px";
    left.style.lineHeight = CONFIG.height + "px";
    left.innerHTML = CONFIG.title;

    clock.style.left = Math.round(CONFIG.width * 0.15) + "px";
    clock.style.width = Math.round(CONFIG.width * 0.10) + "px";
    clock.style.height = CONFIG.height + "px";
    clock.style.lineHeight = CONFIG.height + "px";

    ticker.style.left = Math.round(CONFIG.width * 0.25) + "px";
    ticker.style.width = Math.round(CONFIG.width * 0.75) + "px";
    ticker.style.height = CONFIG.height + "px";
    ticker.style.lineHeight = CONFIG.height + "px";

}


/* =========================
   CLOCK
========================= */

function startClock(){

    setInterval(()=>{

        const d = new Date();

        document.getElementById("clock").innerHTML =
        String(d.getHours()).padStart(2,'0') + ":" +
        String(d.getMinutes()).padStart(2,'0');

    },1000);

}


/* =========================
   SAFE TEXT
========================= */

function safe(t){
    return (t || "")
    .replace(/[\n\r]/g," ")
    .slice(0,120);
}


/* =========================
   CACHE
========================= */

let CACHE = {
    news:[],
    esporte:[],
    politica:[]
};


/* =========================
   API
========================= */

async function getGNews(query){

    try{

        const r =
        await fetch(
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&max=5&apikey=9c1aaf5a12ad6ffe75f77c7fe15ad790"
        );

        const d = await r.json();

        return (d.articles || []).map(a=>a.title);

    }catch(e){
        return [];
    }

}


/* =========================
   LOAD
========================= */

async function loadAll(){

    await updateCache();
    render();

    setInterval(async ()=>{
        await updateCache();
        render();
    },60000);

}


/* =========================
   UPDATE CACHE
========================= */

async function updateCache(){

    const n = await getGNews("brasil economia");
    if(n.length) CACHE.news = n;

    const s = await getGNews("futebol");
    if(s.length) CACHE.esporte = s;

    const p = await getGNews("politica");
    if(p.length) CACHE.politica = p;

}


/* =========================
   PICK
========================= */

function pick(arr){
    if(!arr || !arr.length) return "";
    return arr[Math.floor(Math.random()*arr.length)];
}


/* =========================
   RENDER
========================= */

function render(){

    const el = document.getElementById("ticker-content");

    el.innerHTML =

    `<span class="clima">CLIMA</span> ${CONFIG.city} 28°C <span class="sep">◆</span>` +

    `<span class="news">NEWS</span> ${safe(pick(CACHE.news))} <span class="sep">◆</span>` +

    `<span class="esporte">ESPORTE</span> ${safe(pick(CACHE.esporte))} <span class="sep">◆</span>` +

    `<span class="politica">POLÍTICA</span> ${safe(pick(CACHE.politica))} <span class="sep">◆</span>`;

}

</script>

</body>
</html>
