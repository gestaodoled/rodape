<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS CONFIG</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* ÁREA ESQUERDA */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

/* =====================================
   CONFIGURAÇÃO DO PAINEL
===================================== */

const CONFIG = {

    /* RESOLUÇÃO */

    width:800,
    height:30,

    /* FONTES */

    fontSize:12,

    /* VELOCIDADE */

    speed:170,

    /* CIDADE */

    city:"São Paulo",

    /* INSTAGRAM */

    instagram:"@lumix.led",

    /* NOME */

    title:"LUMIX NEWS",

    /* BLOCOS ATIVOS */

    enabledBlocks:[

        "clima",
        "previsao",
        "transito",
        "rodovias",
        "esporte",
        "resultados",
        "selecao",
        "classificacao",
        "dolar",
        "euro",
        "bitcoin",
        "mercado",
        "tech",
        "trending",
        "eventos",
        "aeroportos",
        "megasena",
        "saude",
        "alerta",
        "entretenimento",
        "news",
        "motivacao",
        "lumix",
        "instagram"

    ]

};


/* =====================================
   APLICA CONFIGURAÇÃO
===================================== */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";


document.getElementById(
"left-box"
).style.width = "120px";

document.getElementById(
"left-box"
).style.height =
CONFIG.height + "px";

document.getElementById(
"left-box"
).style.lineHeight =
CONFIG.height + "px";

document.getElementById(
"left-box"
).style.fontSize =
CONFIG.fontSize + "px";

document.getElementById(
"left-box"
).innerHTML =
CONFIG.title;


/* RELÓGIO */

document.getElementById(
"clock"
).style.left = "121px";

document.getElementById(
"clock"
).style.width = "70px";

document.getElementById(
"clock"
).style.height =
CONFIG.height + "px";

document.getElementById(
"clock"
).style.lineHeight =
CONFIG.height + "px";

document.getElementById(
"clock"
).style.fontSize =
CONFIG.fontSize + "px";


/* TICKER */

document.getElementById(
"ticker"
).style.left = "192px";

document.getElementById(
"ticker"
).style.width =
(CONFIG.width - 192) + "px";

document.getElementById(
"ticker"
).style.height =
CONFIG.height + "px";

document.getElementById(
"ticker"
).style.lineHeight =
CONFIG.height + "px";

document.getElementById(
"ticker"
).style.fontSize =
CONFIG.fontSize + "px";


/* VELOCIDADE */

document.getElementById(
"ticker-content"
).style.animationDuration =
CONFIG.speed + "s";


/* =====================================
   RELÓGIO
===================================== */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById(
    "clock"
    ).innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =====================================
   LIMPA TEXTO
===================================== */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/�/g,"")
    .trim();

}


/* =====================================
   RSS
===================================== */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =====================================
   CLIMA
===================================== */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =====================================
   COTAÇÕES
===================================== */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =====================================
   PEGA ITEM ALEATÓRIO
===================================== */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =====================================
   RESULTADOS
===================================== */

const resultados = [

    "Palmeiras 2x1 Santos",
    "Corinthians 1x1 São Paulo",
    "Flamengo 3x0 Vasco",
    "Atlético-MG 1x0 Cruzeiro"

];


/* =====================================
   CLASSIFICAÇÃO
===================================== */

const classificacao = [

    "Palmeiras líder Série A",
    "Flamengo no G4",
    "Corinthians sobe posições",
    "São Paulo mira Libertadores"

];


/* =====================================
   CONTEÚDO
===================================== */

async function loadContent(){

    let html = "";


    /* CLIMA */

    if(CONFIG.enabledBlocks.includes("clima")){

        const weather =
        await getWeather();

        html +=
        '<span class="clima">CLIMA</span> ' +
        CONFIG.city + ' ' +
        weather.temp +
        '°C' +
        '<span class="sep">◆</span>';

    }


    /* PREVISÃO */

    if(CONFIG.enabledBlocks.includes("previsao")){

        const weather =
        await getWeather();

        html +=
        '<span class="previsao">PREVISÃO</span> Máx ' +
        weather.max +
        '° Mín ' +
        weather.min +
        '°' +
        '<span class="sep">◆</span>';

    }


    /* RESULTADOS */

    if(CONFIG.enabledBlocks.includes("resultados")){

        html +=
        '<span class="resultados">RESULTADOS</span> ' +
        resultados[
        Math.floor(
        Math.random() * resultados.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* CLASSIFICAÇÃO */

    if(CONFIG.enabledBlocks.includes("classificacao")){

        html +=
        '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
        classificacao[
        Math.floor(
        Math.random() * classificacao.length
        )] +
        '<span class="sep">◆</span>';

    }


    /* DÓLAR */

    if(CONFIG.enabledBlocks.includes("dolar")){

        const money =
        await getMoney();

        html +=
        '<span class="dolar">DÓLAR</span> R$ ' +
        money.usd +
        '<span class="sep">◆</span>';

    }


    /* EURO */

    if(CONFIG.enabledBlocks.includes("euro")){

        const money =
        await getMoney();

        html +=
        '<span class="euro">EURO</span> R$ ' +
        money.eur +
        '<span class="sep">◆</span>';

    }


    /* BITCOIN */

    if(CONFIG.enabledBlocks.includes("bitcoin")){

        const money =
        await getMoney();

        html +=
        '<span class="bitcoin">BITCOIN</span> R$ ' +
        money.btc +
        '<span class="sep">◆</span>';

    }


    /* INSTAGRAM */

    if(CONFIG.enabledBlocks.includes("instagram")){

        html +=
        '<span class="instagram">INSTAGRAM</span> ' +
        CONFIG.instagram +
        '<span class="sep">◆</span>';

    }


    /* LUMIX */

    if(CONFIG.enabledBlocks.includes("lumix")){

        html +=
        '<span class="lumix">LUMIX LED</span> Impacto visual que vende' +
        '<span class="sep">◆</span>';

    }


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* =====================================
   INICIAR
===================================== */

loadContent();


/* =====================================
   CICLOS
===================================== */

let cycleCount = 0;

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});

</script>

</body>
</html>
