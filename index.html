<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* LEFT */
#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* CLOCK */
#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */
#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

/* CONTENT */
#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* COLORS */
.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.rodovias{color:#FFA500;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.trending{color:#FF69B4;font-weight:bold;}
.eventos{color:#BA55D3;font-weight:bold;}
.aeroportos{color:#40E0D0;font-weight:bold;}
.megasena{color:#32CD32;font-weight:bold;}
.saude{color:#FF1493;font-weight:bold;}
.alerta{color:#FF0000;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.motivacao{color:#00FFCC;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Carregando informações...</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const configName = params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<script>

/* ================= CONFIG VISUAL ================= */

document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").style.lineHeight = CONFIG.height + "px";
document.getElementById("left-box").style.fontSize = CONFIG.fontSize + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height = CONFIG.height + "px";
document.getElementById("clock").style.lineHeight = CONFIG.height + "px";
document.getElementById("clock").style.fontSize = CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height = CONFIG.height + "px";
document.getElementById("ticker").style.lineHeight = CONFIG.height + "px";
document.getElementById("ticker").style.fontSize = CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";

/* ================= CORE ================= */

let cycleCount = 0;

/* CLOCK */
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerHTML =
    String(now.getHours()).padStart(2,'0') + ":" +
    String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* CLEAN */
function cleanText(text){
    if(!text) return "";
    const t = document.createElement("textarea");
    t.innerHTML = text;
    return t.value.replace(/Â/g,"").replace(/[\n\r]/g," ").trim();
}

/* RSS */
async function getRSS(url){
    try{
        const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url);
        const r = await fetch(api);
        const d = await r.json();
        return d.items || [];
    }catch{
        return [];
    }
}

/* WEATHER */
async function getWeather(){
    try{
        const r = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=America%2FSao_Paulo`
        );
        const d = await r.json();

        return {
            temp: Math.round(d.current.temperature_2m),
            max: Math.round(d.daily.temperature_2m_max[0]),
            min: Math.round(d.daily.temperature_2m_min[0]),
            code: d.daily.weathercode[0]
        };

    }catch{
        return {temp:18,max:24,min:17,code:0};
    }
}

/* MONEY */
async function getMoney(){
    try{
        const r = await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL");
        const d = await r.json();

        return {
            usd: parseFloat(d.USDBRL.bid).toFixed(2),
            eur: parseFloat(d.EURBRL.bid).toFixed(2),
            btc: Math.round(d.BTCBRL.bid)
        };
    }catch{
        return {usd:"5.42",eur:"6.14",btc:"580000"};
    }
}

/* PICK */
function pickOne(arr){
    if(!arr || !arr.length) return null;
    return arr[Math.floor(Math.random()*arr.length)];
}

/* SAFE RSS (SEM ALTERAR CONTEÚDO) */
async function safeRSS(primary, fallback){
    let data = await getRSS(primary);

    if(!data.length && fallback){
        for(let f of fallback){
            let alt = await getRSS(f);
            if(alt.length){
                return alt;
            }
        }
    }
    return data;
}

/* ================= LOAD ================= */

async function loadContent(){

    let html = "";

    const weather = await getWeather();
    const money = await getMoney();

    for(let block of CONFIG.enabledBlocks){

        if(block === "clima"){
            html += `<span class="clima">CLIMA</span> ${CONFIG.city} ${weather.temp}°C<span class="sep">◆</span>`;
        }

        if(block === "previsao"){
            html += `<span class="previsao">PREVISÃO</span> Máx ${weather.max}° Mín ${weather.min}°<span class="sep">◆</span>`;
        }

        if(block === "transito"){

            let t = await safeRSS(CONFIG.trafficRSS,[
                "https://g1.globo.com/rss/g1/sao-paulo/",
                "https://rss.uol.com.br/feed/noticias.xml"
            ]);

            t = t.filter(i=>{
                const x=i.title.toLowerCase();
                return x.includes("trânsito")||x.includes("transito")||x.includes("acidente")||x.includes("lentidão")||x.includes("marginal")||x.includes("rodovia");
            });

            let item = pickOne(t);

            html += `<span class="transito">TRÂNSITO</span> ${item?cleanText(item.title):"SP fluindo normalmente"}<span class="sep">◆</span>`;
        }

        if(block === "esporte"){

            let e = await safeRSS(
                "https://ge.globo.com/rss/ge/futebol/",
                ["https://rss.uol.com.br/feed/esporte.xml","https://feeds.bbci.co.uk/sport/football/rss.xml"]
            );

            let item = pickOne(e);

            html += `<span class="esporte">ESPORTE</span> ${item?cleanText(item.title):"Futebol em atualização"}<span class="sep">◆</span>`;
        }

        if(block === "resultados"){
            let r = await getRSS("https://ge.globo.com/rss/ge/futebol/");
            let item = pickOne(r);
            if(item) html += `<span class="resultados">RESULTADOS</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "selecao"){
            let r = await getRSS("https://ge.globo.com/rss/ge/futebol/selecao-brasileira/");
            let item = pickOne(r);
            if(item) html += `<span class="selecao">SELEÇÃO</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "classificacao"){
            let r = await getRSS("https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/");
            let item = pickOne(r);
            if(item) html += `<span class="classificacao">CLASSIFICAÇÃO</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "dolar") html += `<span class="dolar">DÓLAR</span> R$ ${money.usd}<span class="sep">◆</span>`;
        if(block === "euro") html += `<span class="euro">EURO</span> R$ ${money.eur}<span class="sep">◆</span>`;
        if(block === "bitcoin") html += `<span class="bitcoin">BITCOIN</span> R$ ${money.btc}<span class="sep">◆</span>`;

        if(block === "mercado"){
            let r = await getRSS("https://g1.globo.com/rss/g1/economia/");
            let item = pickOne(r);
            if(item) html += `<span class="mercado">MERCADO</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "tech"){
            let r = await getRSS("https://g1.globo.com/rss/g1/tecnologia/");
            let item = pickOne(r);
            if(item) html += `<span class="tech">TECH</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "trending"){
            let r = await getRSS("https://rss.uol.com.br/feed/tecnologia.xml");
            let item = pickOne(r);
            if(item) html += `<span class="trending">TRENDING</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "eventos"){
            let r = await getRSS(CONFIG.trafficRSS);
            let item = pickOne(r);
            if(item) html += `<span class="eventos">EVENTOS</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "aeroportos"){
            let r = await getRSS("https://g1.globo.com/rss/g1/economia/");
            r = r.filter(i=>{
                const x=i.title.toLowerCase();
                return x.includes("aeroporto")||x.includes("voo")||x.includes("avião")||x.includes("congonhas")||x.includes("guarulhos");
            });
            let item = pickOne(r);
            if(item) html += `<span class="aeroportos">AEROPORTOS</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "megasena"){
            try{
                const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/megasena");
                const d = await r.json();
                html += `<span class="megasena">MEGA-SENA</span> Concurso ${d.numero} prêmio R$ ${Number(d.valorEstimadoProximoConcurso).toLocaleString('pt-BR')}<span class="sep">◆</span>`;
            }catch{}
        }

        if(block === "saude"){
            let r = await getRSS("https://g1.globo.com/rss/g1/bemestar/");
            let item = pickOne(r);
            if(item) html += `<span class="saude">SAÚDE</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "alerta"){
            let msg = null;
            if(weather.code >= 95) msg = "Alerta de tempestades";
            else if(weather.code >= 61) msg = "Possibilidade de chuva";

            if(msg) html += `<span class="alerta">ALERTA</span> ${msg}<span class="sep">◆</span>`;
        }

        if(block === "entretenimento"){
            let r = await getRSS("https://g1.globo.com/rss/g1/pop-arte/");
            let item = pickOne(r);
            if(item) html += `<span class="entretenimento">ENTRETENIMENTO</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "news"){
            let r = await getRSS("https://g1.globo.com/rss/g1/");
            let item = pickOne(r);
            if(item) html += `<span class="news">NEWS</span> ${cleanText(item.title)}<span class="sep">◆</span>`;
        }

        if(block === "motivacao"){
            const f=["Grandes resultados exigem constância","Persistência gera resultados","Disciplina vence talento","Foco no objetivo"];
            html += `<span class="motivacao">MOTIVAÇÃO</span> ${f[Math.floor(Math.random()*f.length)]}<span class="sep">◆</span>`;
        }

        if(block === "lumix"){
            const f=["Impacto visual que vende","Especialistas em painéis de LED","Tecnologia visual de alto impacto"];
            html += `<span class="lumix">LUMIX LED</span> ${f[Math.floor(Math.random()*f.length)]}<span class="sep">◆</span>`;
        }

        if(block === "instagram"){
            html += `<span class="instagram">INSTAGRAM</span> ${CONFIG.instagram}<span class="sep">◆</span>`;
        }
    }

    document.getElementById("ticker-content").innerHTML = html;
}

loadContent();

const ticker = document.getElementById("ticker-content");

ticker.addEventListener("animationiteration", async ()=>{
    cycleCount++;
    if(cycleCount >= 2){
        cycleCount = 0;
        await loadContent();
    }
});

setInterval(()=>location.reload(),1800000);

</script>

</body>
</html>
