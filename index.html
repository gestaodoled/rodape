<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=30">

<title>LUMIX NEWS</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 110s linear infinite;
}

/* ESTILOS */

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">
        Carregando informações...
    </div>
</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   URL SEM CACHE
========================= */

function noCache(url){

    return url +
    (url.includes('?') ? '&' : '?') +
    '_nocache=' +
    new Date().getTime();

}


/* =========================
   RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(
            noCache(rssUrl)
        );

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        console.log("Erro RSS:",rssUrl);

        return [];

    }

}


/* =========================
   CLIMA ONLINE
========================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(
            data.current.temperature_2m
            ),

            max:
            Math.round(
            data.daily.temperature_2m_max[0]
            ),

            min:
            Math.round(
            data.daily.temperature_2m_min[0]
            )

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================
   DÓLAR ONLINE
========================= */

async function getDollar(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL"
        );

        const data =
        await response.json();

        return parseFloat(
        data.USDBRL.bid
        ).toFixed(2);

    }catch(error){

        return "5.42";

    }

}


/* =========================
   EMBARALHAR ITENS
========================= */

function shuffle(array){

    return array.sort(() =>
    Math.random() - 0.5);

}


/* =========================
   CARREGAR CONTEÚDO
========================= */

async function loadContent(){

    let html = "";


    /* CLIMA */

    const weather =
    await getWeather();

    html +=
    '<span class="label">CLIMA</span> São Paulo ' +
    weather.temp +
    '°C' +
    '<span class="sep">◆</span>';


    /* PREVISÃO */

    html +=
    '<span class="label">PREVISÃO</span> Máx ' +
    weather.max +
    '° Mín ' +
    weather.min +
    '°' +
    '<span class="sep">◆</span>';


    /* ESPORTES */

    const geNews =
    await getRSS(
    "https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/"
    );

    const uolEsporte =
    await getRSS(
    "https://rss.uol.com.br/feed/esporte.xml"
    );

    const esportes =
    shuffle([
        ...geNews.slice(0,2),
        ...uolEsporte.slice(0,2)
    ]);

    esportes.forEach(item => {

        html +=
        '<span class="label">ESPORTE</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* ECONOMIA */

    const economiaG1 =
    await getRSS(
    "https://g1.globo.com/rss/g1/economia/"
    );

    const economiaUol =
    await getRSS(
    "https://rss.uol.com.br/feed/economia.xml"
    );

    const economia =
    shuffle([
        ...economiaG1.slice(0,2),
        ...economiaUol.slice(0,2)
    ]);

    economia.forEach(item => {

        html +=
        '<span class="label">MERCADO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* DÓLAR */

    const dollar =
    await getDollar();

    html +=
    '<span class="label">DÓLAR</span> R$ ' +
    dollar +
    '<span class="sep">◆</span>';


    /* TECNOLOGIA */

    const tech1 =
    await getRSS(
    "https://g1.globo.com/rss/g1/tecnologia/"
    );

    const tech2 =
    await getRSS(
    "https://feeds.feedburner.com/tecnoblog"
    );

    const tech =
    shuffle([
        ...tech1.slice(0,2),
        ...tech2.slice(0,2)
    ]);

    tech.forEach(item => {

        html +=
        '<span class="label">TECH</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* TRÂNSITO REAL VIA NOTÍCIAS SP */

    const spNews =
    await getRSS(
    "https://g1.globo.com/rss/g1/sao-paulo/"
    );

    const transito =
    spNews.filter(item => {

        const t =
        item.title.toLowerCase();

        return t.includes("trânsito") ||
               t.includes("acidente") ||
               t.includes("rodovia") ||
               t.includes("marginal") ||
               t.includes("lentidão");

    });

    transito.slice(0,3).forEach(item => {

        html +=
        '<span class="label">TRÂNSITO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* ENTRETENIMENTO */

    const entretenimento1 =
    await getRSS(
    "https://g1.globo.com/rss/g1/pop-arte/"
    );

    const entretenimento2 =
    await getRSS(
    "https://rss.uol.com.br/feed/splash.xml"
    );

    const entretenimento =
    shuffle([
        ...entretenimento1.slice(0,2),
        ...entretenimento2.slice(0,2)
    ]);

    entretenimento.forEach(item => {

        html +=
        '<span class="label">ENTRETENIMENTO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* NEWS GERAIS */

    const g1 =
    await getRSS(
    "https://g1.globo.com/rss/g1/"
    );

    const cnn =
    await getRSS(
    "https://www.cnnbrasil.com.br/feed/"
    );

    const uol =
    await getRSS(
    "https://rss.uol.com.br/feed/noticias.xml"
    );

    const geral =
    shuffle([
        ...g1.slice(0,2),
        ...cnn.slice(0,2),
        ...uol.slice(0,2)
    ]);

    geral.forEach(item => {

        html +=
        '<span class="label">NEWS</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* INSTAGRAM */

    html +=
    '<span class="label">INSTAGRAM</span> Siga @lumix.led' +
    '<span class="sep">◆</span>';


    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* =========================
   INICIAR
========================= */

loadContent();


/* =========================
   ATUALIZA A CADA 4 MIN
========================= */

setInterval(() => {

    loadContent();

},240000);

</script>

</body>
</html>
