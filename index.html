<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>19 LUMIX NEWS PRO STABLE</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#fff;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #fff;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#fff;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

.sep{color:#666;padding:0 14px;}

.clima{color:#00FFFF;font-weight:bold;}
.news{color:#fff;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.politica{color:#FF4444;font-weight:bold;}
.mundo{color:#4FC3F7;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}

</style>

</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>
<div id="ticker">
<div id="ticker-content">Carregando...</div>
</div>

<script>

/* CONFIG BASE SEGURA */
const CONFIG = window.CONFIG || {
    width:800,
    height:30,
    speed:70,
    city:"São Paulo",
    title:"LUMIX"
};

/* LAYOUT */
document.body.style.width = CONFIG.width + "px";
document.body.style.height = CONFIG.height + "px";

document.getElementById("left-box").style.width = "120px";
document.getElementById("left-box").style.height = CONFIG.height + "px";
document.getElementById("left-box").style.lineHeight = CONFIG.height + "px";
document.getElementById("left-box").innerHTML = CONFIG.title;

document.getElementById("clock").style.left = "121px";
document.getElementById("clock").style.width = "80px";
document.getElementById("clock").style.height = CONFIG.height + "px";
document.getElementById("clock").style.lineHeight = CONFIG.height + "px";

document.getElementById("ticker").style.left = "200px";
document.getElementById("ticker").style.width = (CONFIG.width - 200) + "px";
document.getElementById("ticker").style.height = CONFIG.height + "px";
document.getElementById("ticker").style.lineHeight = CONFIG.height + "px";

document.getElementById("ticker-content").style.animationDuration = CONFIG.speed + "s";


/* CLOCK */
setInterval(()=>{
    const d = new Date();
    document.getElementById("clock").innerHTML =
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0');
},1000);


/* SAFE TEXT */
function safe(t){
    return (t || "")
    .replace(/[\n\r]/g," ")
    .slice(0,120);
}


/* CACHE LOCAL (SE API FALHAR NADA MUDA) */
let CACHE = {
    news:[
        "Economia em destaque no Brasil",
        "Mercado financeiro segue estável",
        "Tecnologia impulsiona inovação"
    ],
    esporte:[
        "Futebol movimenta rodada nacional",
        "Clubes seguem preparação intensa"
    ],
    politica:[
        "Cenário político em atualização",
        "Decisões no congresso em foco"
    ]
};


/* API (COM FALLBACK REAL) */
async function fetchNews(query){
    try{
        const r = await fetch(
        "https://gnews.io/api/v4/search?q="+query+"&lang=pt&max=5&apikey=9c1aaf5a12ad6ffe75f77c7fe15ad790"
        );
        const d = await r.json();
        return (d.articles || []).map(a=>a.title);
    }catch(e){
        return [];
    }
}


/* UPDATE CACHE (SE FALHAR USA LOCAL) */
async function updateCache(){

    const n = await fetchNews("brasil economia");
    if(n.length) CACHE.news = n;

    const s = await fetchNews("futebol");
    if(s.length) CACHE.esporte = s;

    const p = await fetchNews("politica");
    if(p.length) CACHE.politica = p;

}


/* RENDER SEM NUNCA QUEBRAR */
function render(){

    let html = "";

    html += `<span class="clima">CLIMA</span> ${CONFIG.city} 28°C${"◆"}`;

    html += `<span class="news">NEWS</span> ${safe(CACHE.news[Math.floor(Math.random()*CACHE.news.length)])}${"◆"}`;

    html += `<span class="esporte">ESPORTE</span> ${safe(CACHE.esporte[Math.floor(Math.random()*CACHE.esporte.length)])}${"◆"}`;

    html += `<span class="politica">POLÍTICA</span> ${safe(CACHE.politica[Math.floor(Math.random()*CACHE.politica.length)])}${"◆"}`;

    document.getElementById("ticker-content").innerHTML = html;
}


/* LOOP ESTÁVEL */
async function loop(){

    await updateCache();
    render();

}

loop();
setInterval(loop, 60000);

</script>

</body>
</html>
