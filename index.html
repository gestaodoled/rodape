<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>TESTE FASE 2 - TRÂNSITO SP</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
overflow:hidden;
}

#box{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-align:center;
}

.transito{
color:#ff8c00;
font-weight:bold;
}
</style>

</head>

<body>

<div id="box">Carregando trânsito SP...</div>

<script>

/* ================= RSS CORE ================= */

async function fetchRSS(url){

try{

const r = await fetch(url);
const t = await r.text();

const xml = new DOMParser().parseFromString(t,"text/xml");
const items = xml.querySelectorAll("item");

let out = [];

items.forEach(i=>{
const title = i.querySelector("title")?.textContent;
if(title) out.push(title);
});

return out;

}catch(e){
return [];
}

}

/* ================= TRÂNSITO SP (MULTIFONTE) ================= */

async function loadTransito(){

let all = [];

const feeds = [

"https://g1.globo.com/rss/g1/sao-paulo/",
"https://g1.globo.com/rss/g1/sao-paulo/mobilidade/",
"https://g1.globo.com/rss/g1/economia/"

];

/* fallback inteligente por palavras-chave */
const keywords = [
"trânsito",
"transito",
"marginal",
"rodovia",
"lentidão",
"acidente",
"colisão",
"engavetamento",
"castelo branco",
"anhanguera",
"imigrantes",
"anchieta"
];

for(let url of feeds){

try{

const data = await fetchRSS(url);

data.forEach(title=>{

let t = title.toLowerCase();

if(keywords.some(k => t.includes(k))){
all.push(title);
}

});

}catch(e){
// ignora feed quebrado
}

}

return all;

}

/* ================= RENDER ================= */

async function start(){

let data = await loadTransito();

if(!data.length){

document.getElementById("box").innerHTML =
"<span class='transito'>TRÂNSITO SP</span><br>Sem dados no momento";

return;

}

let html = "<span class='transito'>TRÂNSITO SP</span><br><br>";

data.slice(0,10).forEach(i=>{
html += "• " + i + "<br>";
});

document.getElementById("box").innerHTML = html;

}

start();

setInterval(start,60000);

</script>

</body>
</html>
