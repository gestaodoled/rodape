<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1150, height=30">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000000;
    width:1150px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:140px;
    height:30px;
    background:#C00000;
    color:#FFFFFF;
    font-size:13px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    z-index:5;
    border-right:1px solid #FFFFFF;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:150px;
    top:0;
    width:80px;
    height:30px;
    background:#111111;
    color:#00FF99;
    font-size:13px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    z-index:5;
    border-right:1px solid #FFFFFF;
}

/* ÁREA DAS NOTÍCIAS */

#ticker{
    position:absolute;
    left:240px;
    top:0;
    width:910px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFFFFF;
    font-size:13px;
    line-height:30px;
}

/* TEXTO ANIMADO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 180s linear infinite;
}

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#777777;
    padding:0 20px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }

}

</style>

</head>

<body>

<!-- BLOCO -->

<div id="left-box">
    LUMIX NEWS
</div>

<!-- RELÓGIO -->

<div id="clock"></div>

<!-- NOTÍCIAS -->

<div id="ticker">

    <div id="ticker-content">
        Carregando notícias...
    </div>

</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById('clock').innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   RSS
========================= */

async function loadNews(){

    try{

        const rssUrl =
        "https://g1.globo.com/rss/g1/";

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response = await fetch(api);

        const data = await response.json();

        let news = "";

        data.items.slice(0,10).forEach(item => {

            news +=
            '<span class="label">NOTÍCIAS</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

        /* DUPLICA TEXTO */

        document.getElementById("ticker-content").innerHTML =
        news + news;

    }catch(error){

        document.getElementById("ticker-content").innerHTML =
        "Erro ao carregar notícias.";

    }

}

loadNews();

setInterval(loadNews,600000);

</script>

</body>
</html>
