<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=30">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 100s linear infinite;
}

/* ESTILOS */

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#777;
    padding:0 15px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   RSS
========================= */

async function getRSS(rssUrl){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response = await fetch(api);

        const data = await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =========================
   CLIMA ONLINE
========================= */

async function getWeather(){

    try{

        const response = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data = await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================
   DÓLAR ONLINE
========================= */

async function getDollar(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL"
        );

        const data =
        await response.json();

        return parseFloat(
        data.USDBRL.bid
        ).toFixed(2);

    }catch(error){

        return "5.42";

    }

}


/* =========================
   CONTEÚDO
========================= */

async function loadContent(){

    let html = "";


    /* CLIMA */

    const weather =
    await getWeather();

    html +=
    '<span class="label">CLIMA</span> São Paulo ' +
    weather.temp +
    '°C ☀' +
    '<span class="sep">◆</span>';


    /* PREVISÃO */

    html +=
    '<span class="label">PREVISÃO</span> Máx ' +
    weather.max +
    '° Mín ' +
    weather.min +
    '°' +
    '<span class="sep">◆</span>';


    /* ESPORTES */

    const geNews =
    await getRSS("https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/");

    const espnNews =
    await getRSS("https://www.espn.com.br/rss/futebol.xml");


    geNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">ESPORTE</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    espnNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">ESPORTE</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* CLASSIFICAÇÃO */

    const tabelaNews =
    await getRSS("https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/");

    tabelaNews.slice(1,2).forEach(item => {

        html +=
        '<span class="label">CLASSIFICAÇÃO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* RESULTADOS */

    const corinthiansNews =
    await getRSS("https://ge.globo.com/rss/ge/futebol/times/corinthians/");

    corinthiansNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">RESULTADOS</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    const palmeirasNews =
    await getRSS("https://ge.globo.com/rss/ge/futebol/times/palmeiras/");

    palmeirasNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">RESULTADOS</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* SELEÇÃO */

    const selecaoNews =
    await getRSS("https://ge.globo.com/rss/ge/futebol/selecao-brasileira/");

    selecaoNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">SELEÇÃO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* TRÂNSITO */

    const transito = [

        "Marginal Tietê com lentidão sentido Castelo Branco",
        "Marginal Pinheiros fluxo intenso próximo à Ponte Estaiada",
        "Rodovia Anhanguera apresenta tráfego moderado",
        "Radial Leste congestionada sentido centro",
        "Rodovia Castelo Branco com trânsito lento na chegada a SP"

    ];

    transito.forEach(item => {

        html +=
        '<span class="label">TRÂNSITO</span> ' +
        item +
        '<span class="sep">◆</span>';

    });


    /* DÓLAR */

    const dollar =
    await getDollar();

    html +=
    '<span class="label">DÓLAR</span> R$ ' +
    dollar +
    '<span class="sep">◆</span>';


    /* INSTAGRAM */

    html +=
    '<span class="label">INSTAGRAM</span> Siga @lumix.led' +
    '<span class="sep">◆</span>';


    /* TECH */

    const techNews =
    await getRSS("https://g1.globo.com/rss/g1/tecnologia/");

    techNews.slice(0,2).forEach(item => {

        html +=
        '<span class="label">TECH</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* MERCADO */

    const economiaNews =
    await getRSS("https://g1.globo.com/rss/g1/economia/");

    economiaNews.slice(0,1).forEach(item => {

        html +=
        '<span class="label">MERCADO FINANCEIRO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* ENTRETENIMENTO */

    const entretenimentoNews =
    await getRSS("https://g1.globo.com/rss/g1/pop-arte/");

    entretenimentoNews.slice(0,2).forEach(item => {

        html +=
        '<span class="label">ENTRETENIMENTO</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* NEWS */

    const geralNews =
    await getRSS("https://g1.globo.com/rss/g1/");

    geralNews.slice(0,2).forEach(item => {

        html +=
        '<span class="label">NEWS</span> ' +
        item.title +
        '<span class="sep">◆</span>';

    });


    /* INSTAGRAM FINAL */

    html +=
    '<span class="label">INSTAGRAM</span> Siga @lumix.led' +
    '<span class="sep">◆</span>';


    document.getElementById("ticker-content").innerHTML =
    html;

}

loadContent();


/* =========================
   ATUALIZA A CADA 4 MINUTOS
========================= */

setInterval(loadContent,240000);

</script>

</body>
</html>
