<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>LUMIX NEWS SYSTEM</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   LAYOUT BASE (ORIGINAL STYLE)
========================= */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #222;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    z-index:4;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll linear infinite;
}

/* =========================
   CORES DO SISTEMA
========================= */

.esporte{color:#00FF00;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.clima{color:#00FFFF;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* =========================
   ANIMAÇÃO
========================= */

@keyframes scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-100%)}
}

</style>
</head>

<body>

<div id="left-box"></div>
<div id="clock"></div>

<div id="ticker">
    <div id="ticker-content">Inicializando sistema...</div>
</div>

<script>

/* =========================
   🧠 CONFIG SAFE (ANTI QUEBRA)
========================= */

const CONFIG = window.CONFIG || {
    width: 1920,
    height: 1080,
    fontSize: 22,
    title: "LUMIX SYSTEM",
    trafficRSS: "https://g1.globo.com/rss/g1/sao-paulo/"
};

/* =========================
   🔧 LAYOUT ORIGINAL NORMALIZADO
========================= */

function initLayout(){

    const w = CONFIG.width || window.innerWidth;
    const h = CONFIG.height || window.innerHeight;

    const left = document.getElementById("left-box");
    const clock = document.getElementById("clock");
    const ticker = document.getElementById("ticker");

    const leftW = w * 0.15;
    const clockW = w * 0.10;

    left.style.width = leftW + "px";
    left.style.height = h + "px";
    left.style.fontSize = CONFIG.fontSize + "px";
    left.innerHTML = CONFIG.title;

    clock.style.left = leftW + "px";
    clock.style.width = clockW + "px";
    clock.style.height = h + "px";
    clock.style.fontSize = CONFIG.fontSize + "px";

    ticker.style.left = (leftW + clockW) + "px";
    ticker.style.width = (w - leftW - clockW) + "px";
    ticker.style.height = h + "px";
    ticker.style.lineHeight = h + "px";
    ticker.style.fontSize = CONFIG.fontSize + "px";
}

initLayout();
window.addEventListener("resize", initLayout);

/* =========================
   🕒 RELÓGIO
========================= */

setInterval(()=>{
    try{
        const d = new Date();
        document.getElementById("clock").innerHTML =
        String(d.getHours()).padStart(2,'0') + ":" +
        String(d.getMinutes()).padStart(2,'0');
    }catch(e){}
},1000);

/* =========================
   🌐 RSS CORE SAFE
========================= */

async function getRSS(url){
    try{
        const r = await fetch(
            "https://api.rss2json.com/v1/api.json?rss_url=" +
            encodeURIComponent(url)
        );

        const d = await r.json();
        return d.items || [];
    }catch{
        return [];
    }
}

function pick(arr){
    if(!arr || !arr.length) return null;
    return arr[Math.floor(Math.random()*arr.length)];
}

/* =========================
   ⚽ ESPORTE (BR + SP + EUROPA)
========================= */

async function getEsporte(){

    const feeds = await Promise.allSettled([
        getRSS("https://ge.globo.com/rss/ge/futebol/"),
        getRSS("https://rss.uol.com.br/feed/esporte.xml"),
        getRSS("https://feeds.bbci.co.uk/sport/football/rss.xml"),
        getRSS("https://www.espn.com/espn/rss/soccer/news")
    ]);

    let all = [];

    feeds.forEach(f=>{
        if(f.status === "fulfilled"){
            all = all.concat(f.value);
        }
    });

    let item = pick(all);

    if(!item){
        return "Futebol nacional e internacional em destaque";
    }

    return item.title;
}

/* =========================
   🚦 TRÂNSITO SP
========================= */

async function getTransito(){

    const feeds = await Promise.allSettled([
        getRSS(CONFIG.trafficRSS),
        getRSS("https://g1.globo.com/rss/g1/sao-paulo/"),
        getRSS("https://rss.uol.com.br/feed/noticias.xml")
    ]);

    let all = [];

    feeds.forEach(f=>{
        if(f.status === "fulfilled"){
            all = all.concat(f.value);
        }
    });

    let filtered = all.filter(i =>
        /trânsito|acidente|lentidão|marginal|rodovia|sp/i.test(i.title)
    );

    let pool = filtered.length ? filtered : all;

    let item = pick(pool);

    if(!item){
        return "SP com fluxo normal no momento";
    }

    return item.title;
}

/* =========================
   🧩 BUILDER PRINCIPAL
========================= */

async function build(){

    let html = "";

    try{

        const [esp, tra] = await Promise.all([
            getEsporte(),
            getTransito()
        ]);

        html += `<span class="esporte">ESPORTE</span> ${esp}<span class="sep">◆</span>`;
        html += `<span class="transito">TRÂNSITO SP</span> ${tra}<span class="sep">◆</span>`;
        html += `<span class="news">NEWS</span> Atualização contínua<span class="sep">◆</span>`;
        html += `<span class="lumix">LUMIX</span> Sistema ativo<span class="sep">◆</span>`;

    }catch(e){

        html =
        `<span class="lumix">LUMIX</span> Sistema em modo seguro<span class="sep">◆</span>`;
    }

    /* =========================
       🔥 GARANTIA ABSOLUTA
    ========================= */

    if(!html || html.trim().length === 0){
        html =
        `<span class="lumix">LUMIX</span> Sistema online<span class="sep">◆</span>`;
    }

    document.getElementById("ticker-content").innerHTML = html;
}

/* =========================
   🔁 LOOP ESTÁVEL
========================= */

build();
setInterval(build, 10000);

</script>

</body>
</html>
