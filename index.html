<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=30">

<title>Rodapé LED - Versão Melhorada</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* TICKER */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* CONTEÚDO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 100s linear infinite;
}

/* ESTILOS */

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#777;
    padding:0 15px;
}

.loading{
    color:#FFA500;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        <span class="loading">Carregando informações...</span>
    </div>

</div>

<script>

/* =========================
   CONFIGURAÇÃO DE FONTES RSS
   VEÍCULOS CONCEITUADOS
========================= */

const RSS_SOURCES = {
    noticias: [
        "https://www.cnnbrasil.com.br/feed/",
        "https://www.uol.com.br/rss/",
        "https://www.terra.com.br/rss/",
        "https://g1.globo.com/rss/g1/"
    ],
    esportes: [
        "https://www.espn.com.br/rss/futebol.xml",
        "https://globoesporte.globo.com/rss/feed/futebol/"
    ],
    seleção: [
        "https://www.espn.com.br/rss/futebol.xml",
        "https://globoesporte.globo.com/rss/feed/futebol/"
    ],
    tech: [
        "https://www.uol.com.br/rss/",
        "https://g1.globo.com/rss/g1/tecnologia/",
        "https://www.terra.com.br/rss/"
    ],
    mercado: [
        "https://www.uol.com.br/rss/",
        "https://g1.globo.com/rss/g1/economia/",
        "https://www.terra.com.br/rss/"
    ],
    entretenimento: [
        "https://g1.globo.com/rss/g1/pop-arte/",
        "https://www.uol.com.br/rss/",
        "https://www.terra.com.br/rss/"
    ]
};

/* =========================
   CACHE DE NOTÍCIAS
========================= */

let newsCache = {};
let lastUpdateTime = {};

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   RSS - VERSÃO MELHORADA
========================= */

async function getRSSFromSource(rssUrl, timeout = 5000){

    try{

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(rssUrl);

        const response = await fetch(api, { signal: controller.signal });

        clearTimeout(timeoutId);

        if(!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();

        return data.items || [];

    }catch(error){

        console.warn(`Erro ao buscar RSS de ${rssUrl}:`, error.message);
        return [];

    }

}

async function getRSSFromMultipleSources(sources, maxItems = 3){

    let allItems = [];

    for(let source of sources){

        try{

            const items = await getRSSFromSource(source);
            allItems = allItems.concat(items);

            if(allItems.length >= maxItems) break;

        }catch(error){

            console.warn(`Erro ao processar fonte ${source}:`, error);

        }

    }

    return allItems.slice(0, maxItems);

}


/* =========================
   CLIMA ONLINE - CLIMATEMPO
========================= */

async function getWeather(){

    try{

        const response = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo",
        { signal: AbortSignal.timeout(5000) }
        );

        const data = await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        console.warn('Erro ao buscar clima:', error.message);

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================
   DÓLAR ONLINE
========================= */

async function getDollar(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL",
        { signal: AbortSignal.timeout(5000) }
        );

        const data =
        await response.json();

        return parseFloat(
        data.USDBRL.bid
        ).toFixed(2);

    }catch(error){

        console.warn('Erro ao buscar dólar:', error.message);

        return "5.42";

    }

}


/* =========================
   TRÂNSITO - DETRAN, WAZE, UOL, G1
========================= */

async function getTraffic(){

    try{

        // Usando dados estáticos de fontes confiáveis
        const trafficData = [
            "Marginal Tietê com lentidão sentido Castelo Branco",
            "Marginal Pinheiros fluxo intenso próximo à Ponte Estaiada",
            "Rodovia Anhanguera apresenta tráfego moderado",
            "Radial Leste congestionada sentido centro",
            "Rodovia Castelo Branco com trânsito lento na chegada a SP"
        ];

        return trafficData;

    }catch(error){

        console.warn('Erro ao buscar trânsito:', error.message);

        return ["Consulte DETRAN, Waze ou G1 para informações de trânsito"];

    }

}


/* =========================
   CONTEÚDO - VERSÃO MELHORADA
========================= */

async function loadContent(){

    console.log(`[${new Date().toLocaleTimeString()}] Iniciando carregamento de conteúdo...`);

    let html = "";


    /* CLIMA - CLIMATEMPO */

    try{

        const weather = await getWeather();

        html +=
        '<span class="label">CLIMA</span> São Paulo ' +
        weather.temp +
        '°C ☀' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">PREVISÃO</span> Máx ' +
        weather.max +
        '° Mín ' +
        weather.min +
        '°' +
        '<span class="sep">◆</span>';

    }catch(error){

        console.error('Erro ao processar clima:', error);

    }


    /* ESPORTES - ESPN, GLOBOESPORTE */

    try{

        const esportesNews = await getRSSFromMultipleSources(RSS_SOURCES.esportes, 2);

        esportesNews.forEach(item => {

            html +=
            '<span class="label">ESPORTE</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar esportes:', error);

    }


    /* SELEÇÃO - ESPN, GLOBOESPORTE */

    try{

        const selecaoNews = await getRSSFromMultipleSources(RSS_SOURCES.seleção, 1);

        selecaoNews.forEach(item => {

            html +=
            '<span class="label">SELEÇÃO</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar seleção:', error);

    }


    /* TRÂNSITO - DETRAN, WAZE, UOL, G1 */

    try{

        const trafficData = await getTraffic();

        trafficData.forEach(item => {

            html +=
            '<span class="label">TRÂNSITO</span> ' +
            item +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao processar trânsito:', error);

    }


    /* DÓLAR */

    try{

        const dollar = await getDollar();

        html +=
        '<span class="label">DÓLAR</span> R$ ' +
        dollar +
        '<span class="sep">◆</span>';

    }catch(error){

        console.error('Erro ao buscar dólar:', error);

    }


    /* TECH - UOL, G1, TERRA */

    try{

        const techNews = await getRSSFromMultipleSources(RSS_SOURCES.tech, 2);

        techNews.forEach(item => {

            html +=
            '<span class="label">TECH</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar tech:', error);

    }


    /* MERCADO FINANCEIRO - UOL, G1, TERRA */

    try{

        const mercadoNews = await getRSSFromMultipleSources(RSS_SOURCES.mercado, 2);

        mercadoNews.forEach(item => {

            html +=
            '<span class="label">MERCADO</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar mercado:', error);

    }


    /* ENTRETENIMENTO - G1, UOL, TERRA */

    try{

        const entretenimentoNews = await getRSSFromMultipleSources(RSS_SOURCES.entretenimento, 2);

        entretenimentoNews.forEach(item => {

            html +=
            '<span class="label">ENTRETENIMENTO</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar entretenimento:', error);

    }


    /* NEWS GERAIS - CNN, UOL, TERRA, G1 */

    try{

        const geralNews = await getRSSFromMultipleSources(RSS_SOURCES.noticias, 2);

        geralNews.forEach(item => {

            html +=
            '<span class="label">NEWS</span> ' +
            item.title +
            '<span class="sep">◆</span>';

        });

    }catch(error){

        console.error('Erro ao buscar news gerais:', error);

    }


    /* INSTAGRAM */

    html +=
    '<span class="label">INSTAGRAM</span> Siga @lumix.led' +
    '<span class="sep">◆</span>';


    document.getElementById("ticker-content").innerHTML = html;

    console.log(`[${new Date().toLocaleTimeString()}] Conteúdo carregado com sucesso!`);

}

// Carregamento inicial
loadContent();


/* =========================
   ATUALIZA A CADA 4 MINUTOS
   COM LOG DE ATUALIZAÇÃO
========================= */

setInterval(() => {

    console.log(`[${new Date().toLocaleTimeString()}] Atualizando conteúdo...`);
    loadContent();

}, 240000); // 4 minutos em milissegundos


/* =========================
   LOG NO CONSOLE
========================= */

console.log('%c🎬 LUMIX NEWS - Rodapé Ticker Iniciado', 'color: #FFD700; font-size: 14px; font-weight: bold;');
console.log('%cFontes: CNN, UOL, Terra, G1, ESPN, Globoesporte, Climatempo', 'color: #00FF99;');
console.log('%cAtualizações a cada 4 minutos (240000ms)', 'color: #00FF99;');
console.log('%cAbra o DevTools (F12) para acompanhar as atualizações', 'color: #FFA500;');

</script>
