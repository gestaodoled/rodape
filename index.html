<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

/* CONFIGURAÇÃO VISUAL */

#left-box{
    position:absolute;
    left:0;
    top:0;
    background:#C00000;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:10;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:10;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

/* CORES */

.clima{color:#00FFFF;font-weight:bold;}
.previsao{color:#87CEFA;font-weight:bold;}
.transito{color:#FF8C00;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box">
    LUMIX NEWS
</div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando notícias...
    </div>

</div>

<script>

/* =========================================
   CONFIG
========================================= */

const CONFIG = {

    width:800,
    height:30,

    fontSize:12,

    /* MAIS RÁPIDO */
    speed:115,

    city:"São Paulo",

    instagram:"@lumix.led",

    title:"LUMIX NEWS",

    enabledBlocks:[

        "clima",
        "previsao",
        "transito",
        "esporte",
        "resultados",
        "classificacao",
        "selecao",
        "dolar",
        "euro",
        "bitcoin",
        "mercado",
        "tech",
        "entretenimento",
        "news",
        "instagram"

    ]

};


/* =========================================
   APLICA CONFIG
========================================= */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";


/* LEFT */

const leftBox =
document.getElementById("left-box");

leftBox.style.width = "120px";
leftBox.style.height = CONFIG.height + "px";
leftBox.style.lineHeight = CONFIG.height + "px";
leftBox.style.fontSize = CONFIG.fontSize + "px";
leftBox.innerHTML = CONFIG.title;


/* CLOCK */

const clock =
document.getElementById("clock");

clock.style.left = "121px";
clock.style.width = "70px";
clock.style.height = CONFIG.height + "px";
clock.style.lineHeight = CONFIG.height + "px";
clock.style.fontSize = CONFIG.fontSize + "px";


/* TICKER */

const ticker =
document.getElementById("ticker");

ticker.style.left = "192px";
ticker.style.width = (CONFIG.width - 192) + "px";
ticker.style.height = CONFIG.height + "px";
ticker.style.lineHeight = CONFIG.height + "px";
ticker.style.fontSize = CONFIG.fontSize + "px";


/* ANIMAÇÃO */

const tickerContent =
document.getElementById("ticker-content");

tickerContent.style.animationDuration =
CONFIG.speed + "s";


/* =========================================
   RELÓGIO
========================================= */

function updateClock(){

    const now = new Date();

    const h =
    String(now.getHours()).padStart(2,'0');

    const m =
    String(now.getMinutes()).padStart(2,'0');

    clock.innerHTML = h + ":" + m;
}

setInterval(updateClock,1000);

updateClock();


/* =========================================
   LIMPA TEXTO
========================================= */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    return txt.value
    .replace(/Â/g,"")
    .replace(/�/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

}


/* =========================================
   RSS
========================================= */

async function getRSS(url){

    try{

        const api =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(
        url + "?t=" + new Date().getTime()
        );

        const response =
        await fetch(api);

        const data =
        await response.json();

        return data.items || [];

    }catch(error){

        return [];

    }

}


/* =========================================
   PEGA ITEM
========================================= */

function pickOne(items){

    if(!items || items.length === 0){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* =========================================
   FILTRO
========================================= */

function safeNews(items){

    const blocked = [

        "morre",
        "morte",
        "crime",
        "guerra",
        "tragédia",
        "assassin"

    ];

    return items.filter(item => {

        if(!item.title) return false;

        const t =
        item.title.toLowerCase();

        return !blocked.some(word =>
        t.includes(word));

    });

}


/* =========================================
   CLIMA
========================================= */

async function getWeather(){

    try{

        const response =
        await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=-23.55&longitude=-46.63&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo"
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:18,
            max:24,
            min:17

        };

    }

}


/* =========================================
   COTAÇÕES
========================================= */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.42",
            eur:"6.14",
            btc:"580000"

        };

    }

}


/* =========================================
   CONTEÚDO
========================================= */

async function loadContent(){

    let html = "";


    /* CLIMA */

    if(CONFIG.enabledBlocks.includes("clima")){

        const weather =
        await getWeather();

        html +=
        '<span class="clima">CLIMA</span> ' +
        CONFIG.city +
        ' ' +
        weather.temp +
        '°C' +
        '<span class="sep">◆</span>';

    }


    /* PREVISÃO */

    if(CONFIG.enabledBlocks.includes("previsao")){

        const weather =
        await getWeather();

        html +=
        '<span class="previsao">PREVISÃO</span> Máx ' +
        weather.max +
        '° Mín ' +
        weather.min +
        '°' +
        '<span class="sep">◆</span>';

    }


    /* TRÂNSITO */

    if(CONFIG.enabledBlocks.includes("transito")){

        let transito =
        await getRSS(
        "https://g1.globo.com/rss/g1/sao-paulo/"
        );

        transito =
        transito.filter(item => {

            const t =
            item.title.toLowerCase();

            return t.includes("trânsito") ||
                   t.includes("transito") ||
                   t.includes("rodovia") ||
                   t.includes("marginal") ||
                   t.includes("acidente");

        });

        const item =
        pickOne(
        safeNews(transito)
        );

        if(item){

            html +=
            '<span class="transito">TRÂNSITO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* ESPORTE */

    if(CONFIG.enabledBlocks.includes("esporte")){

        const feeds = [

            "https://ge.globo.com/rss/ge/futebol/",
            "https://www.espn.com.br/rss/futebol.xml",
            "https://rss.uol.com.br/feed/esporte.xml"

        ];

        const feed =
        feeds[
        Math.floor(
        Math.random() * feeds.length
        )];

        let esporte =
        await getRSS(feed);

        const item =
        pickOne(
        safeNews(esporte)
        );

        if(item){

            html +=
            '<span class="esporte">ESPORTE</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* RESULTADOS */

    if(CONFIG.enabledBlocks.includes("resultados")){

        let resultados =
        await getRSS(
        "https://ge.globo.com/rss/ge/futebol/"
        );

        resultados =
        resultados.filter(item => {

            const t =
            item.title;

            return /\d+x\d+/i.test(t);

        });

        const item =
        pickOne(resultados);

        if(item){

            html +=
            '<span class="resultados">RESULTADOS</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* CLASSIFICAÇÃO */

    if(CONFIG.enabledBlocks.includes("classificacao")){

        let tabela =
        await getRSS(
        "https://ge.globo.com/rss/ge/futebol/brasileirao-serie-a/"
        );

        const item =
        pickOne(
        safeNews(tabela)
        );

        if(item){

            html +=
            '<span class="classificacao">CLASSIFICAÇÃO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* SELEÇÃO */

    if(CONFIG.enabledBlocks.includes("selecao")){

        let selecao =
        await getRSS(
        "https://ge.globo.com/rss/ge/selecao-brasileira/"
        );

        const item =
        pickOne(
        safeNews(selecao)
        );

        if(item){

            html +=
            '<span class="selecao">SELEÇÃO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* COTAÇÕES */

    const money =
    await getMoney();

    if(CONFIG.enabledBlocks.includes("dolar")){

        html +=
        '<span class="dolar">DÓLAR</span> R$ ' +
        money.usd +
        '<span class="sep">◆</span>';

    }

    if(CONFIG.enabledBlocks.includes("euro")){

        html +=
        '<span class="euro">EURO</span> R$ ' +
        money.eur +
        '<span class="sep">◆</span>';

    }

    if(CONFIG.enabledBlocks.includes("bitcoin")){

        html +=
        '<span class="bitcoin">BITCOIN</span> R$ ' +
        money.btc +
        '<span class="sep">◆</span>';

    }


    /* MERCADO */

    if(CONFIG.enabledBlocks.includes("mercado")){

        let mercado =
        await getRSS(
        "https://g1.globo.com/rss/g1/economia/"
        );

        const item =
        pickOne(
        safeNews(mercado)
        );

        if(item){

            html +=
            '<span class="mercado">MERCADO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* TECH */

    if(CONFIG.enabledBlocks.includes("tech")){

        let tech =
        await getRSS(
        "https://g1.globo.com/rss/g1/tecnologia/"
        );

        const item =
        pickOne(
        safeNews(tech)
        );

        if(item){

            html +=
            '<span class="tech">TECH</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* ENTRETENIMENTO */

    if(CONFIG.enabledBlocks.includes("entretenimento")){

        let entretenimento =
        await getRSS(
        "https://g1.globo.com/rss/g1/pop-arte/"
        );

        const item =
        pickOne(
        safeNews(entretenimento)
        );

        if(item){

            html +=
            '<span class="entretenimento">ENTRETENIMENTO</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* NEWS */

    if(CONFIG.enabledBlocks.includes("news")){

        const feeds = [

            "https://g1.globo.com/rss/g1/",
            "https://rss.uol.com.br/feed/noticias.xml",
            "https://www.cnnbrasil.com.br/feed/"

        ];

        const feed =
        feeds[
        Math.floor(
        Math.random() * feeds.length
        )];

        let news =
        await getRSS(feed);

        const item =
        pickOne(
        safeNews(news)
        );

        if(item){

            html +=
            '<span class="news">NEWS</span> ' +
            cleanText(item.title) +
            '<span class="sep">◆</span>';

        }

    }


    /* INSTAGRAM */

    if(CONFIG.enabledBlocks.includes("instagram")){

        html +=
        '<span class="instagram">INSTAGRAM</span> ' +
        CONFIG.instagram +
        '<span class="sep">◆</span>';

    }


    tickerContent.innerHTML = html;

}


/* =========================================
   INICIAR
========================================= */

loadContent();


/* =========================================
   ATUALIZA APÓS 2 CICLOS
========================================= */

let cycleCount = 0;

tickerContent.addEventListener(
"animationiteration",
async function(){

    cycleCount++;

    if(cycleCount >= 2){

        cycleCount = 0;

        await loadContent();

    }

});

</script>

</body>
</html>
