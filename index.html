<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>17 LUMIX NEWS PRO</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

#left-box{
    position:absolute;
    left:0;
    top:0;
    color:#FFF;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#clock{
    position:absolute;
    top:0;
    background:#111;
    color:#00FF99;
    font-weight:bold;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

#ticker{
    position:absolute;
    top:0;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
}

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation-name:scroll;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
}

.clima{color:#00FFFF;font-weight:bold;}
.esporte{color:#00FF00;font-weight:bold;}
.resultados{color:#32CD32;font-weight:bold;}
.selecao{color:#7CFC00;font-weight:bold;}
.classificacao{color:#ADFF2F;font-weight:bold;}
.dolar{color:#FFD700;font-weight:bold;}
.euro{color:#F4D03F;font-weight:bold;}
.bitcoin{color:#F39C12;font-weight:bold;}
.mercado{color:#00FA9A;font-weight:bold;}
.tech{color:#00BFFF;font-weight:bold;}
.news{color:#FFFFFF;font-weight:bold;}
.lumix{color:#FFD700;font-weight:bold;}
.instagram{color:#FF1493;font-weight:bold;}

.politica{color:#FF4444;font-weight:bold;}
.mundo{color:#4FC3F7;font-weight:bold;}
.entretenimento{color:#FF66CC;font-weight:bold;}
.agro{color:#8BC34A;font-weight:bold;}
.ciencia{color:#00E5FF;font-weight:bold;}
.games{color:#AA66CC;font-weight:bold;}

.sep{
    color:#666;
    padding:0 14px;
}

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<div id="left-box"></div>

<div id="clock"></div>

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const configName =
params.get("config") || "default";

document.write(
'<script src="configs/' +
configName +
'.js?v=' +
new Date().getTime() +
'"><\/script>'
);

</script>

<script>

/* CONFIG VISUAL */

document.body.style.width =
CONFIG.width + "px";

document.body.style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.width =
Math.round(CONFIG.width * 0.15) + "px";

document.getElementById("left-box").style.background =
CONFIG.titleBackground || "#C00000";

document.getElementById("left-box").style.height =
CONFIG.height + "px";

document.getElementById("left-box").style.lineHeight =
CONFIG.height + "px";

document.getElementById("left-box").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("left-box").innerHTML =
CONFIG.title;

document.getElementById("clock").style.left =
Math.round(CONFIG.width * 0.15 + 1) + "px";

document.getElementById("clock").style.width =
Math.round(CONFIG.width * 0.09) + "px";

document.getElementById("clock").style.height =
CONFIG.height + "px";

document.getElementById("clock").style.lineHeight =
CONFIG.height + "px";

document.getElementById("clock").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker").style.left =
Math.round(CONFIG.width * 0.24) + "px";

document.getElementById("ticker").style.width =
Math.round(CONFIG.width * 0.76) + "px";

document.getElementById("ticker").style.height =
CONFIG.height + "px";

document.getElementById("ticker").style.lineHeight =
CONFIG.height + "px";

document.getElementById("ticker").style.fontSize =
CONFIG.fontSize + "px";

document.getElementById("ticker-content").style.animationDuration =
CONFIG.speed + "s";


/* RELÓGIO */

function updateClock(){

    const now = new Date();

    const hours =
    String(now.getHours()).padStart(2,'0');

    const minutes =
    String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
    hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* LIMPA TEXTO */

function cleanText(text){

    if(!text) return "";

    const txt =
    document.createElement("textarea");

    txt.innerHTML = text;

    let result = txt.value;

    result = result
    .replace(/Â/g,"")
    .replace(/[\n\r]/g," ")
    .trim();

    return result;

}


/* CLIMA */

async function getWeather(){

    try{

        const response =
        await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo`
        );

        const data =
        await response.json();

        return {

            temp:
            Math.round(data.current.temperature_2m),

            max:
            Math.round(data.daily.temperature_2m_max[0]),

            min:
            Math.round(data.daily.temperature_2m_min[0])

        };

    }catch(error){

        return {

            temp:22,
            max:28,
            min:18

        };

    }

}


/* MOEDAS */

async function getMoney(){

    try{

        const response =
        await fetch(
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,BTC-BRL"
        );

        const data =
        await response.json();

        return {

            usd:
            parseFloat(data.USDBRL.bid).toFixed(2),

            eur:
            parseFloat(data.EURBRL.bid).toFixed(2),

            btc:
            Math.round(data.BTCBRL.bid)

        };

    }catch(error){

        return {

            usd:"5.40",
            eur:"6.10",
            btc:"580000"

        };

    }

}


/* APIs */

const GNEWS_KEY =
"9c1aaf5a12ad6ffe75f77c7fe15ad790";

const NEWSDATA_KEY =
"pub_81dda51e603744ad9bfbb85b23339f46";


/* CACHE */

let NEWS_CACHE = [];
let TECH_CACHE = [];
let MARKET_CACHE = [];
let SPORT_CACHE = [];
let SELECAO_CACHE = [];
let RESULT_CACHE = [];

let POLITICA_CACHE = [];
let MUNDO_CACHE = [];
let ENTRETENIMENTO_CACHE = [];
let AGRO_CACHE = [];
let CIENCIA_CACHE = [];
let GAMES_CACHE = [];

let RESULT_INDEX = 0;


/* GNEWS */

async function getGNews(query){

    try{

        const url =
        "https://gnews.io/api/v4/search?q=" +
        encodeURIComponent(query) +
        "&lang=pt&max=10&apikey=" +
        GNEWS_KEY;

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(data.articles){

            return data.articles;

        }

        return [];

    }catch(error){

        return [];

    }

}


/* SPORTS */

async function getSportsNews(query){

    try{

        const url =
        "https://newsdata.io/api/1/news?apikey=" +
        NEWSDATA_KEY +
        "&language=pt&category=sports&q=" +
        encodeURIComponent(query);

        const response =
        await fetch(url);

        const data =
        await response.json();

        return data.results || [];

    }catch(error){

        return [];

    }

}


/* LOAD NEWS */

async function loadNews(){

    NEWS_CACHE =
    await getGNews("brasil");

    TECH_CACHE =
    await getGNews("tecnologia");

    MARKET_CACHE =
    await getGNews("economia");

    POLITICA_CACHE =
    await getGNews("politica");

    MUNDO_CACHE =
    await getGNews("mundo");

    ENTRETENIMENTO_CACHE =
    await getGNews("entretenimento");

    AGRO_CACHE =
    await getGNews("agro");

    CIENCIA_CACHE =
    await getGNews("ciencia");

    GAMES_CACHE =
    await getGNews("games");

    SPORT_CACHE =
    await getSportsNews("futebol");

    SELECAO_CACHE =
    await getSportsNews("seleção brasileira");

}


/* RESULTADOS */

async function loadResults(){

    try{

        const response =
        await fetch(
        "https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4328"
        );

        const data =
        await response.json();

        RESULT_CACHE =
        data.events || [];

    }catch(error){

        RESULT_CACHE = [];

    }

}


/* RANDOM */

function pickOne(items){

    if(!items || !items.length){

        return null;

    }

    return items[
    Math.floor(
    Math.random() * items.length
    )];

}


/* LOAD CONTENT */

async function loadContent(){

    let html = "";

    const weather =
    await getWeather();

    const money =
    await getMoney();

    for(let block of CONFIG.enabledBlocks){

        try{

            if(block === "clima"){

                html +=
                '<span class="clima">CLIMA</span> ' +
                CONFIG.city +
                ' ' +
                weather.temp +
                '°C Máx ' +
                weather.max +
                '° Min ' +
                weather.min +
                '°' +
                '<span class="sep">◆</span>';

            }

            if(block === "politica"){

                if(POLITICA_CACHE.length){

                    const item =
                    pickOne(POLITICA_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="politica">POLÍTICA</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "mundo"){

                if(MUNDO_CACHE.length){

                    const item =
                    pickOne(MUNDO_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="mundo">MUNDO</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "entretenimento"){

                if(ENTRETENIMENTO_CACHE.length){

                    const item =
                    pickOne(ENTRETENIMENTO_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="entretenimento">ENTRETENIMENTO</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "agro"){

                if(AGRO_CACHE.length){

                    const item =
                    pickOne(AGRO_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="agro">AGRO</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "ciencia"){

                if(CIENCIA_CACHE.length){

                    const item =
                    pickOne(CIENCIA_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="ciencia">CIÊNCIA</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "games"){

                if(GAMES_CACHE.length){

                    const item =
                    pickOne(GAMES_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="games">GAMES</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

            if(block === "news"){

                if(NEWS_CACHE.length){

                    const item =
                    pickOne(NEWS_CACHE);

                    if(item && item.title){

                        html +=
                        '<span class="news">NEWS</span> ' +
                        cleanText(item.title) +
                        '<span class="sep">◆</span>';

                    }

                }

            }

        }catch(e){}

    }

    document.getElementById(
    "ticker-content"
    ).innerHTML = html;

}


/* START */

(async () => {

    await loadNews();

    await loadContent();

})();


/* UPDATE */

const ticker =
document.getElementById(
"ticker-content"
);

ticker.addEventListener(
"animationiteration",
async function(){

    await loadNews();

    await loadContent();

});


/* RELOAD */

setInterval(() => {

    location.reload();

}, 1800000);

</script>

</body>
</html>
