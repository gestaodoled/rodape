<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=30">

<title>Rodapé LED</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    width:800px;
    height:30px;
    font-family:Verdana,sans-serif;
}

/* BLOCO ESQUERDO */

#left-box{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:30px;
    background:#C00000;
    color:#FFF;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* RELÓGIO */

#clock{
    position:absolute;
    left:121px;
    top:0;
    width:70px;
    height:30px;
    background:#111;
    color:#00FF99;
    font-size:12px;
    font-weight:bold;
    line-height:30px;
    text-align:center;
    border-right:1px solid #FFF;
    z-index:5;
}

/* ÁREA DAS NOTÍCIAS */

#ticker{
    position:absolute;
    left:192px;
    top:0;
    width:608px;
    height:30px;
    overflow:hidden;
    white-space:nowrap;
    color:#FFF;
    font-size:12px;
    line-height:30px;
}

/* TEXTO ANIMADO */

#ticker-content{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 90s linear infinite;
}

/* CORES */

.label{
    color:#FFD700;
    font-weight:bold;
}

.sep{
    color:#777;
    padding:0 18px;
}

/* ANIMAÇÃO */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-100%);
    }

}

</style>

</head>

<body>

<!-- BLOCO -->

<div id="left-box">
    LUMIX NEWS
</div>

<!-- RELÓGIO -->

<div id="clock"></div>

<!-- TICKER -->

<div id="ticker">

    <div id="ticker-content">
        Carregando informações...
    </div>

</div>

<script>

/* =========================
   RELÓGIO
========================= */

function updateClock(){

    const now = new Date();

    const hours = String(now.getHours()).padStart(2,'0');
    const minutes = String(now.getMinutes()).padStart(2,'0');

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;
}

setInterval(updateClock,1000);

updateClock();


/* =========================
   CONTEÚDO
========================= */

async function loadContent(){

    try{

        let html = "";

        /* CLIMA */

        html +=
        '<span class="label">CLIMA</span> São Paulo 18°C ☀' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">PREVISÃO</span> Máx 24° Mín 17°' +
        '<span class="sep">◆</span>';


        /* ESPORTES */

        html +=
        '<span class="label">ESPORTE</span> Palmeiras líder Série A' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">ESPORTE</span> Corinthians vence clássico' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">ESPORTE</span> São Paulo anuncia reforço' +
        '<span class="sep">◆</span>';


        /* CLASSIFICAÇÃO */

        html +=
        '<span class="label">CLASSIFICAÇÃO</span> Corinthians 6º' +
        '<span class="sep">◆</span>';


        /* DÓLAR */

        html +=
        '<span class="label">DÓLAR</span> R$ 5,42' +
        '<span class="sep">◆</span>';


        /* SELEÇÃO */

        html +=
        '<span class="label">SELEÇÃO</span> Dorival convoca elenco' +
        '<span class="sep">◆</span>';


        /* INVESTIMENTOS */

        html +=
        '<span class="label">INVESTIMENTOS</span> Ibovespa sobe 0,8%' +
        '<span class="sep">◆</span>';


        /* ENTRETENIMENTO */

        html +=
        '<span class="label">ENTRETENIMENTO</span> Novo filme lidera bilheteria' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">ENTRETENIMENTO</span> Festival reúne milhares em SP' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">ENTRETENIMENTO</span> Série bate recorde de audiência' +
        '<span class="sep">◆</span>';


        /* NEWS */

        html +=
        '<span class="label">NEWS</span> Mercado fecha em alta nesta terça' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">NEWS</span> Tecnologia impulsiona investimentos' +
        '<span class="sep">◆</span>';

        html +=
        '<span class="label">NEWS</span> São Paulo registra queda na temperatura' +
        '<span class="sep">◆</span>';


        document.getElementById("ticker-content").innerHTML =
        html;

    }catch(error){

        document.getElementById("ticker-content").innerHTML =
        "Erro ao carregar informações.";

    }

}

loadContent();

</script>

</body>
</html>
